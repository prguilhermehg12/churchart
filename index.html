const COST_RATES={
  'gpt-5.6-sol':{input:5, cached:0.5, output:30, kind:'text'},
  'gpt-5.6':{input:5, cached:0.5, output:30, kind:'text'},

};
function beginCostSession(label='Criação'){
  state.costSupervisor={sessionId:crypto.randomUUID(),startedAt:Date.now(),events:[],label,currency:'USD'};
  renderCostSupervisor();
}
function usageNum(obj,...paths){
  for(const path of paths){
    let v=obj;
    for(const k of path.split('.'))v=v?.[k];
    if(Number.isFinite(Number(v)))return Number(v);
  }
  return 0;
}
function estimateUsageCost(model,usage,toolUsage=null){
  if(!usage&&!toolUsage)return {usd:0,estimated:true,note:'usage indisponível'};
  const r=COST_RATES[model]||COST_RATES['gpt-5.6-sol'];
  if(r.kind==='text'){
    const input=usageNum(usage,'input_tokens','prompt_tokens');
    const output=usageNum(usage,'output_tokens','completion_tokens');
    const cached=usageNum(usage,'input_tokens_details.cached_tokens','prompt_tokens_details.cached_tokens');
    const uncached=Math.max(0,input-cached);
    return {usd:(uncached*r.input+cached*r.cached+output*r.output)/1e6,estimated:false,input,output,cached};
  }
  const u=toolUsage||usage||{};
  const ti=usageNum(u,'input_tokens_details.text_tokens','input_details.text_tokens','text_input_tokens');
  const ii=usageNum(u,'input_tokens_details.image_tokens','input_details.image_tokens','image_input_tokens');
  const ci=usageNum(u,'input_tokens_details.cached_tokens','input_details.cached_tokens');
  const to=usageNum(u,'output_tokens_details.text_tokens','output_details.text_tokens','text_output_tokens');
  const io=usageNum(u,'output_tokens_details.image_tokens','output_details.image_tokens','image_output_tokens');
  const input=usageNum(u,'input_tokens','prompt_tokens');
  const output=usageNum(u,'output_tokens','completion_tokens');
  if(ti||ii||to||io){
    const imageCached=Math.min(ii,ci),textCached=Math.max(0,ci-imageCached);
    const usd=((Math.max(0,ti-textCached)*r.text_input)+(textCached*r.text_cached)+(Math.max(0,ii-imageCached)*r.image_input)+(imageCached*r.image_cached)+(to*r.text_output)+(io*r.image_output))/1e6;
    return {usd,estimated:false,input,output,textInput:ti,imageInput:ii,textOutput:to,imageOutput:io,cached:ci};
  }
  // Se a API não detalhar modalidade, usamos todos os tokens de entrada como imagem e saída como imagem:
  // é deliberadamente conservador para o supervisor não subestimar gasto.
  return {usd:(input*r.image_input+output*r.image_output)/1e6,estimated:true,input,output,note:'modalidade estimada'};
}
function recordCostEvent(stage,meta={}){
  if(!state.costSupervisor?.sessionId)beginCostSession('Criação');
  const model=meta.model||meta.modelUsed||'desconhecido';
  const calc=estimateUsageCost(model,meta.usage||null,meta.toolUsage||null);
  state.costSupervisor.events.push({
    id:crypto.randomUUID(),stage,model,usd:calc.usd||0,estimated:!!calc.estimated,
    input:calc.input||0,output:calc.output||0,cached:calc.cached||0,note:calc.note||'',at:Date.now()
  });
  renderCostSupervisor();
}

async function fetchActualOpenAICost(startMs,endMs=Date.now()){
  try{
    const r=await fetch(`/api/openai-costs?start=${Math.floor(startMs/1000)}&end=${Math.floor(endMs/1000)}`);
    const d=await r.json();
    if(r.ok&&Number.isFinite(Number(d.cost))){
      state.costSupervisor.actualCost=Number(d.cost);
      state.costSupervisor.actualEnd=endMs;
      renderCostSupervisor();
      return Number(d.cost);
    }
  }catch{}
  return null;
}
function scheduleActualCostReconcile(){
  if(!state.user?.isAdmin||!state.costSupervisor?.startedAt)return;
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),5000);
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),20000);
}

  </div>`;
}

function enableDraw(){
  const canvas=document.querySelector('#canvas');
  const overlay=document.querySelector('#interactionLayer');
  const img=canvas ? canvas.querySelector('img') : null;
  const cancelBtn=document.querySelector('#cancelDrawBtn');
  if(!canvas||!overlay)return;

  if(img){
    img.draggable=false;
    img.style.pointerEvents='none';
    img.style.userSelect='none';
    img.style.webkitUserDrag='none';
    img.ondragstart=()=>false;
  }

  let drawing=false;
  let origin=null;
  let draft=null;

  const point=e=>{
    const r=canvas.getBoundingClientRect();
    return {
      x:Math.max(0,Math.min(r.width,e.clientX-r.left)),
      y:Math.max(0,Math.min(r.height,e.clientY-r.top)),
      r
    };
  };

  const updateDraft=p=>{
    if(!drawing||!origin||!draft)return;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);
    Object.assign(draft.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
  };

  const cleanup=()=>{
    if(draft){draft.remove();draft=null;}
    drawing=false;
    origin=null;
    overlay.classList.remove('is-drawing');
    canvas.classList.remove('drawing-now');
    if(cancelBtn)cancelBtn.disabled=true;
  };

  const cancelSelection=()=>{
    if(!drawing)return;
    cleanup();
    showMapNotice('Seleção cancelada','Nenhuma camada foi criada. Você pode tentar novamente.','neutral');
  };

  const finish=e=>{
    if(!drawing)return;
    e.preventDefault();
    e.stopPropagation();
    const p=point(e);
    const r=origin.r;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);

    if(width<18||height<18){
      cleanup();
      showMapNotice('Seleção pequena demais','Clique e arraste envolvendo o elemento que deseja marcar.','neutral');
      return;
    }

    const select=document.querySelector('#layerType');
    const type=select?select.value:'other';
    const typeInfo=layerTypes.find(x=>x[0]===type)||layerTypes[layerTypes.length-1];
    const layer={
      id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
      type,
      typeLabel:typeInfo[1],
      name:guessName(type),
      color:colors[state.layers.length%colors.length],
      x:left/r.width*100,
      y:top/r.height*100,
      w:width/r.width*100,
      h:height/r.height*100,
      description:'',
      replacement:''
    };

    state.layers.push(layer);
    state.lastMarked=layer.id;
    const currentIndex=layerTypes.findIndex(x=>x[0]===type);
    state.nextLayerType=layerTypes[(currentIndex+1)%layerTypes.length][0];
    cleanup();
    screenMap();
  };

  overlay.addEventListener('mousedown',e=>{
    if(e.button!==0||drawing)return;
    e.preventDefault();
    e.stopPropagation();
    const p=point(e);
    origin={x:p.x,y:p.y,r:p.r};
    drawing=true;

    draft=document.createElement('div');
    draft.className='annotation drawing';
    draft.style.setProperty('--boxColor',colors[state.layers.length%colors.length]);
    Object.assign(draft.style,{left:p.x+'px',top:p.y+'px',width:'0px',height:'0px'});
    draft.innerHTML='<span>Selecionando…</span>';
    canvas.appendChild(draft);
    overlay.classList.add('is-drawing');
    canvas.classList.add('drawing-now');
    if(cancelBtn)cancelBtn.disabled=false;
  });

  overlay.addEventListener('mousemove',e=>{
    if(!drawing)return;
    e.preventDefault();
    updateDraft(point(e));
  });

  overlay.addEventListener('mouseup',finish);
  overlay.addEventListener('mouseleave',e=>{
    if(drawing) updateDraft(point(e));
  });

  window.addEventListener('mouseup',e=>{
    if(drawing) finish(e);
  });

  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&drawing){
      e.preventDefault();
      cancelSelection();
    }
  });


  const touchPoint=e=>{
    const t=e.touches?.[0]||e.changedTouches?.[0];if(!t)return null;
    return point({clientX:t.clientX,clientY:t.clientY});
  };
  overlay.addEventListener('touchstart',e=>{
    if(drawing)return;e.preventDefault();const p=touchPoint(e);if(!p)return;
    origin={x:p.x,y:p.y,r:p.r};drawing=true;
    draft=document.createElement('div');draft.className='annotation drawing';draft.style.setProperty('--boxColor',colors[state.layers.length%colors.length]);
    Object.assign(draft.style,{left:p.x+'px',top:p.y+'px',width:'0px',height:'0px'});draft.innerHTML='<span>Selecionando…</span>';
    canvas.appendChild(draft);overlay.classList.add('is-drawing');canvas.classList.add('drawing-now');if(cancelBtn)cancelBtn.disabled=false;
  },{passive:false});
  overlay.addEventListener('touchmove',e=>{if(!drawing)return;e.preventDefault();const p=touchPoint(e);if(p)updateDraft(p);},{passive:false});
  overlay.addEventListener('touchend',e=>{if(!drawing)return;e.preventDefault();const t=e.changedTouches?.[0];if(t)finish({preventDefault(){},stopPropagation(){},clientX:t.clientX,clientY:t.clientY});},{passive:false});

  if(cancelBtn)cancelBtn.onclick=cancelSelection;
}

async function optimizeImageFile(file,maxDim=1600,quality=.88){
  if(!file)return null;
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
  if(file.type==='image/png'&&file.size<900000)return raw;
  const img=await loadImage(raw);
  const scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',quality);
}

  const c=document.createElement('canvas');c.width=base.naturalWidth;c.height=base.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(base,0,0,c.width,c.height);
  const box={x:(Number(layer.x)||0)/100*c.width,y:(Number(layer.y)||0)/100*c.height,w:(Number(layer.w)||20)/100*c.width,h:(Number(layer.h)||10)/100*c.height};
  const ratio=Math.min(box.w/logo.naturalWidth,box.h/logo.naturalHeight);const dw=logo.naturalWidth*ratio,dh=logo.naturalHeight*ratio;
  ctx.drawImage(logo,box.x+(box.w-dw)/2,box.y+(box.h-dh)/2,dw,dh);return c.toDataURL('image/png');
}
function computePreferenceProfile(){
  const ratings=state.library.ratings||[];if(!ratings.length)return null;
  const buckets={design_style:{},inspiration_style:{},effect:{},audience:{}};
  ratings.forEach((r,i)=>{const weight=(Number(r.rating)||3)-3;const recency=1+Math.max(0,(ratings.length-i)/Math.max(1,ratings.length))*.15;for(const k of Object.keys(buckets)){const v=r[k];if(v)buckets[k][v]=(buckets[k][v]||0)+weight*recency;}});
  const top=k=>Object.entries(buckets[k]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
  return {designStyle:top('design_style'),inspirationStyle:top('inspiration_style'),effect:top('effect'),audience:top('audience')};
}

async function downloadDataUrl(dataUrl,filename,meta={}){
  try{
    let blob=null;
    if(String(dataUrl).startsWith('data:')){
      const comma=dataUrl.indexOf(','),head=dataUrl.slice(0,comma),raw=dataUrl.slice(comma+1),mime=(head.match(/^data:([^;,]+)/)||[])[1]||'image/png';
      if(/;base64/i.test(head)){const bin=atob(raw),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);blob=new Blob([bytes],{type:mime});}
      else blob=new Blob([decodeURIComponent(raw)],{type:mime});
    }else{
      try{const r=await fetch(dataUrl,{cache:'no-store'});if(r.ok)blob=await r.blob();}catch(_){ }
      if(!blob){const local=await remoteToDataUrl(dataUrl);return downloadDataUrl(local,filename,meta);}
    }
    if(!blob||!blob.size)throw new Error('Arquivo de imagem vazio.');
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename||'churchdesign.png';a.rel='noopener';a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);if(!meta?.silentRating)setTimeout(()=>showRatingPopup(meta),450);return true;
  }catch(e){console.error('downloadDataUrl',e);showMapNotice('Não foi possível baixar','Tente novamente. A imagem continua salva nesta tela.');return false;}
}

async function callQualityInspector(payload,signal=null){
  try{
    const r=await fetch('/api/quality-inspector',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});
    const text=await r.text();
    let data;
    try{data=JSON.parse(text)}
    catch{
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:['Fiscal retornou resposta inválida.'],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'invalid_json'}
      };
    }
    if(!r.ok){
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:[data?.error||`Fiscal indisponível (${r.status}).`],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'http_error'}
      };
    }
    recordCostEvent(payload?.phase==='final_typography'?'Fiscal final':'Fiscal visual',data.meta||{});
    const review=data.review||{};
    if(typeof review.approved!=='boolean'){
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:['Fiscal não devolveu uma decisão válida.'],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'invalid_shape'}
      };
    }
    return review;
  }catch(e){
    if(e?.name==='AbortError')throw e;
    return {
      approved:true,
      critical_error:false,
      score:0,
      technicalFailure:true,
      gross_errors:[`Fiscal indisponível: ${e.message||'falha técnica'}`],
      correction_prompt:'',
      _meta:{technicalFailure:true,reason:'exception'}
    };
  }
}
async function generateWithInvisibleReview(payload,maxCorrections=1,signal=null){
  let lastReview=null,lastImage=null;
  const retryInstructions=[
    '',
    'Corrija apenas os erros objetivos apontados pelo fiscal. Preserve o restante da composição. Se houver risco de degradar rosto, logo ou tipografia, simplifique.'
  ];

  for(let attempt=0;attempt<=maxCorrections;attempt++){
    const qualityCorrection=[
      retryInstructions[Math.min(attempt,retryInstructions.length-1)],
      lastReview?.correction_prompt||''
    ].filter(Boolean).join(' ');

    const request={...payload,qualityCorrection,revisionAttempt:attempt,safeMode:attempt>=maxCorrections&&attempt>0};
    const r=await fetch('/api/generate-art',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(request),
      signal
    });

    const text=await r.text();
    let data;
    try{data=JSON.parse(text)}
    catch{throw new Error(text.slice(0,180)||`Resposta inválida (${r.status})`);}
    if(!r.ok)throw new Error(data.error||`Erro ${r.status}`);

    recordCostEvent(attempt===0?'Gerador de imagem':`Retry de imagem ${attempt}`,data.image?.meta||data.meta||{});
    lastImage=data.image;

    const review=await callQualityInspector({
      generatedImage:lastImage.url,
      references:payload.references||[],
      assets:payload.assets||{},
      requiredContent:payload.requiredContent||{},
      semanticMap:payload.semanticMap||[],
      userInstruction:payload.instruction||'',
      finalInstruction:payload.finalInstruction||'',
      artDirection:payload.artDirection||null,
      audience:payload.audience||null,
      designStyle:payload.designStyle||null,
      logoPosition:payload.logoPosition||null,nativeCanvasRequired:true,churchImageMustBeBackground:true,typographyBlueprint:payload.artDirection?.typographyBlueprint||null
    },signal);

    lastReview=review;

    // REGRA DE ENTREGA GARANTIDA:
    // falha técnica do fiscal nunca destrói uma imagem já paga/gerada.
    if(review?.technicalFailure||review?._meta?.technicalFailure){
      return {
        ...lastImage,
        review:{
          ...review,
          approved:true,
          deliveredDespiteInspectorFailure:true
        }
      };
    }

    if(review.approved){
      return {...lastImage,review};
    }

    // Reprovação real: tenta corrigir somente se ainda houver retry disponível.
    if(attempt<maxCorrections)continue;

    // Se já gastamos a última tentativa, entregamos a última imagem válida.
    // A UI pode indicar internamente que foi entregue após revisão não aprovada,
    // mas não deve descartar o ativo pago.
    return {
      ...lastImage,
      review:{
        ...lastReview,
        deliveredAfterFinalReview:true
      }
    };
  }

  if(lastImage)return {...lastImage,review:lastReview||{approved:true,technicalFailure:true}};
  throw new Error('Nenhuma imagem foi gerada.');
}

async function drawTextLayer(ctx,c,l,text,fontFamily){
  const x=l.x/100*c.width,y=l.y/100*c.height,w=l.w/100*c.width,h=l.h/100*c.height;
  const role=l.type==='titlepart'?'title':l.type,td=role==='title'?titleDirection():null;
  let value=String(text||'');if(td?.uppercase)value=value.toUpperCase();
  let size=Math.max(12,Math.floor(h*(role==='title'?(Number(td?.scale)||.82):.7)));
  ctx.save();ctx.translate(x+w/2,y+h/2);if(role==='title'&&td?.rotation)ctx.rotate(Number(td.rotation)*Math.PI/180);
  ctx.textBaseline='middle';ctx.textAlign='center';ctx.font=`900 ${size}px ${fontFamily}`;
  while(size>10&&ctx.measureText(value).width>w*(role==='title'?1.12:.96)){size-=2;ctx.font=`900 ${size}px ${fontFamily}`;}
  const palette=state.artDirection?.palette||{};
  ctx.fillStyle=role==='title'?normalizeHex(td?.fill||palette.accent||palette.foreground,'#ffffff'):normalizeHex(palette.foreground,'#ffffff');
  const shadowStrength=Number(td?.shadow)||.55;ctx.shadowColor=`rgba(0,0,0,${Math.max(0,Math.min(.9,shadowStrength))})`;
  ctx.shadowBlur=Math.max(2,size*(role==='title'?.12:.08));ctx.shadowOffsetX=role==='title'?Math.round(size*.04):0;ctx.shadowOffsetY=role==='title'?Math.round(size*.05):0;
  if(role==='title'&&td?.outline){ctx.lineWidth=Math.max(1,size*(Number(td.outlineWidth)||.035));ctx.strokeStyle=normalizeHex(td.outlineColor||palette.background,'#111111');ctx.strokeText(value,0,0,w*1.18);}
  const tracking=role==='title'?Math.round(size*(Number(td?.tracking)||0)):0;drawTrackedText(ctx,value,0,0,tracking);ctx.restore();
}

function editableSemanticKeys(required={}){
  return ['subtitle','date','time','address','pastorNames'].filter(k=>{
    const v=required?.[k];
    return Array.isArray(v)?v.length>0:!!v;
  });
}
function hybridTypographyInstruction(required={}){
  const keys=editableSemanticKeys(required);
  if(!keys.length)return '';
  return `TIPOGRAFIA HÍBRIDA: o título principal pode permanecer artístico/nativo quando isso preservar melhor o design. Os seguintes campos serão renderizados depois como texto preciso: ${keys.join(', ')}. NÃO escreva esses campos na imagem base. Em vez disso, reserve áreas naturais para eles e descreva no typographyBlueprint a posição, alinhamento, cor, contraste, tamanho relativo, largura máxima, peso e família visual que você usaria se fosse o designer final.`;
}
function normalizeTypographyBlueprint(bp={}){
  const out={};
  for(const [k,v] of Object.entries(bp||{})){
    if(!v||typeof v!=='object')continue;
    out[k]={
      x:Math.min(92,Math.max(8,Number(v.x)||50)),
      y:Math.min(92,Math.max(8,Number(v.y)||50)),
      maxWidth:Math.min(76,Math.max(12,Number(v.maxWidth)||35)),
      align:['left','center','right'].includes(v.align)?v.align:'left',
      color:/^#[0-9A-F]{6}$/i.test(v.color||'')?v.color:'#FFFFFF',
      contrast:['light-on-dark','dark-on-light','auto'].includes(v.contrast)?v.contrast:'auto',
      weight:['regular','medium','bold','black'].includes(v.weight)?v.weight:'bold',
      sizePct:Math.min(8,Math.max(1.2,Number(v.sizePct)||3)),
      familyStyle:String(v.familyStyle||'sans condensed'),
      box:!!v.box
    };
  }
  return out;
}

}

function renderQuickResultsHTML(){if(!state.quickResults.length)return '';return `<div class="card"><h3>Artes desta criação</h3><p style="margin-bottom:10px">As variações ficam lado a lado.</p><div class="quick-results-row">${state.quickResults.map((r,i)=>quickResultCardHTML(r,i)).join('')}</div></div>`;}
function quickResultCardHTML(r,i){const adaptButtons=['story','youtube','screen','square','wide16','fourthree','threetwo'].map(f=>{const t=quickTargetSpec(f);return `<button class="quick-adapt-btn" data-qadapt="${i}-${f}" type="button">${t.label}</button>`}).join('');return `<div class="quick-result-card" id="quickResultCard-${i}"><img src="${r.dataUrl}"><div class="quick-result-body"><h4>${esc(r.label)} • ${esc(r.target.label)}</h4>${r.typographyPlan?`<div class="typography-policy"><strong>Tipografia adaptativa</strong><div class="tp-tags">${Object.entries(r.typographyPlan.roles||{}).map(([k,p])=>`<span class="tp-tag">${k}: ${p.mode}</span>`).join('')}</div></div>`:''}<div class="quick-actions"><button class="mini-btn download-btn" data-qdownload="${i}">↓ Baixar</button>${i===state.quickResults.length-1&&i<2?`<button class="mini-btn" data-qvariation="${i+1}">Gerar variação ${i+1}</button>`:''}<button class="mini-btn" data-qreload="${i}">↻ Corrigir / redesenhar</button></div><div class="field" style="margin-top:8px"><label>Correção desta arte</label><textarea data-qcorrection="${i}">${esc(r.correction||'')}</textarea></div><strong style="font-size:9px">Criar outro tamanho</strong><div class="quick-adapt-grid">${adaptButtons}</div><div id="quickAdaptConfig-${i}"></div><div class="quick-adaptations" id="quickAdaptations-${i}">${(r.adaptations||[]).map(a=>quickAdaptationHTML(a,i)).join('')}</div></div></div>`;}
function openQuickAdaptConfig(i,f){const target=quickTargetSpec(f),box=document.querySelector(`#quickAdaptConfig-${i}`);if(!box)return;box.innerHTML=`<div class="adapt-config"><strong>${target.label}: o que deve ser omitido?</strong><div class="adapt-omit-grid"><label><input type="checkbox" data-omit="subtitle">Omitir subtítulo</label><label><input type="checkbox" data-omit="date">Omitir data</label><label><input type="checkbox" data-omit="time">Omitir hora</label><label><input type="checkbox" data-omit="address">Omitir endereço</label><label><input type="checkbox" data-omit="logo">Omitir logo</label><label><input type="checkbox" data-omit="pastorNames">Omitir nome do(s) pregador(es)</label><label><input type="checkbox" data-omit="pastors">Omitir foto do(s) pregador(es)</label><label><input type="checkbox" data-omit="churchImage">Omitir foto da igreja</label>${f==='screen'?`<label class="dark-screen-option"><input type="checkbox" data-dark-screen>Versão escura para telão / transmissão</label>`:''}</div><button class="mini-btn" data-confirm-adapt="${i}-${f}" style="width:100%;margin-top:8px">Gerar ${target.label}</button></div>`;box.querySelector('[data-confirm-adapt]').onclick=()=>{const omit=[...box.querySelectorAll('[data-omit]:checked')].map(x=>x.dataset.omit);const darkScreen=!!box.querySelector('[data-dark-screen]:checked');runQuickAdaptation(i,f,omit,darkScreen);};}
function quickAdaptationHTML(a,parentIndex){return `<div class="quick-adapt-item ${a.format==='story'?'story':''}"><img src="${a.dataUrl}"><div style="min-width:0;flex:1"><strong style="font-size:9px">${esc(a.target.label)}</strong><small style="display:block;font-size:8px;color:var(--muted)">${a.target.width}×${a.target.height}</small></div><button class="mini-btn download-btn" data-qadapt-download="${parentIndex}-${a.id}">↓</button></div>`;}
function bindQuickResultEvents(){
  document.querySelectorAll('[data-qdownload]').forEach(b=>b.onclick=()=>{const r=state.quickResults[+b.dataset.qdownload];downloadDataUrl(r.dataUrl,`churchdesign-${r.label.toLowerCase().replace(/\s+/g,'-')}.png`,{label:r.label,format:r.target?.id||state.quick.format,target:r.target,designStyle:state.quick.designStyle,audience:state.quick.audience,inspirationStyle:state.quick.inspirationStyle,effect:state.quick.effect})});
  document.querySelectorAll('[data-qvariation]').forEach(b=>b.onclick=()=>{scrollToGenerationPanel();runQuickGeneration(`Variação ${b.dataset.qvariation}`,Number(b.dataset.qvariation))});
  document.querySelectorAll('[data-qreload]').forEach(b=>b.onclick=()=>{const i=+b.dataset.qreload,t=document.querySelector(`[data-qcorrection="${i}"]`);scrollToGenerationPanel();runQuickGeneration(state.quickResults[i].label,i,t?.value||'',i)});
  document.querySelectorAll('[data-qadapt]').forEach(b=>b.onclick=()=>{const [i,f]=b.dataset.qadapt.split('-');openQuickAdaptConfig(Number(i),f)});
  document.querySelectorAll('[data-qadapt-download]').forEach(b=>b.onclick=()=>{const [i,id]=b.dataset.qadaptDownload.split('-'),a=state.quickResults[+i]?.adaptations?.find(x=>x.id===id);if(a)downloadDataUrl(a.dataUrl,`churchdesign-${a.target.id}.png`,{label:a.target.label,format:a.target.id,target:a.target,designStyle:state.quick.designStyle,audience:state.quick.audience,inspirationStyle:state.quick.inspirationStyle,effect:state.quick.effect})});
}
function setQuickProgress(pct,text){const wrap=document.querySelector('#quickProgress'),bar=document.querySelector('#quickProgressBar'),label=document.querySelector('#quickProgressText'),num=document.querySelector('#quickProgressPct');if(!wrap)return;wrap.classList.toggle('show',pct>0&&pct<100);if(bar)bar.style.width=`${pct}%`;if(label)label.textContent=text||'Processando sua arte...';if(num)num.textContent=`${pct}%`;}
async function resizeToTarget(dataUrl,target){
  const img=await loadImageSafe(dataUrl);const c=document.createElement('canvas');c.width=target.width;c.height=target.height;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  // Background extension: cover + blur; this may crop only decorative background.
  ctx.save();ctx.filter='blur(28px) saturate(.9)';ctx.globalAlpha=.82;drawImageCover(ctx,img,c.width,c.height);ctx.restore();
  // Hard safety lock: the COMPLETE generated artwork is never cropped and is inset 7% from every edge.
  const margin=Math.round(Math.min(c.width,c.height)*.07),aw=c.width-margin*2,ah=c.height-margin*2,r=Math.min(aw/img.naturalWidth,ah/img.naturalHeight),dw=img.naturalWidth*r,dh=img.naturalHeight*r;
  ctx.drawImage(img,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
  return c.toDataURL('image/png');
}
async function runQuickGeneration(label,variationIndex,correction='',replaceIndex=null){scrollToGenerationPanel();if(label==='Principal'&&replaceIndex===null)beginCostSession('Modo Rápido • primeira arte');const status=document.querySelector('#quickStatus'),btn=document.querySelector('#quickGenerate'),cancel=document.querySelector('#quickCancel'),signal=beginProcess();btn.disabled=true;if(cancel)cancel.style.display='block';setQuickProgress(8,'Preparando sua arte...');if(status)status.textContent='Processando sua arte...';try{const payload=await quickPayload(label,correction,signal);setQuickProgress(30,'Organizando a criação...');payload.variantId=`quick-${variationIndex}`;payload.variantLabel=label;payload.variantInstruction=variationIndex===0?'Crie a proposta principal.':`Crie uma variação de layout ${variationIndex}, mantendo identidade, dados e linguagem visual.`;setQuickProgress(48,'Criando sua arte...');const image=await generateWithInvisibleReview(payload,1,signal);setQuickProgress(88,'Finalizando...');let dataUrl=await remoteToDataUrl(image.url);dataUrl=await resizeToTarget(dataUrl,payload.target);dataUrl=await applyTypographyPlan(dataUrl,payload.typographyPlan,payload.requiredContent,payload.target);const finalReview=await callQualityInspector({generatedImage:dataUrl,preTypographyImage:image.url,references:payload.references||[],assets:payload.assets||{},requiredContent:payload.requiredContent||{},semanticMap:[],userInstruction:payload.instruction||'',finalInstruction:payload.finalInstruction||'',artDirection:payload.artDirection||null,typographyPlan:payload.typographyPlan,phase:'final_typography'},signal);if(finalReview.typography_conversion_safe===false){const aiPayload={...payload,forceAiTypography:true,typographyPlan:{...payload.typographyPlan,force_ai:true}};const aiImage=await generateWithInvisibleReview(aiPayload,1,signal);dataUrl=await remoteToDataUrl(aiImage.url);dataUrl=await resizeToTarget(dataUrl,payload.target);}const result={id:crypto.randomUUID(),label,dataUrl,sourceUrl:image.url,target:payload.target,artDirection:payload.artDirection,typographyPlan:payload.typographyPlan,requiredContent:payload.requiredContent,assets:payload.assets,instruction:payload.instruction,adaptations:[],correction:''};if(replaceIndex===null)state.quickResults.push(result);else{
      const original=state.quickResults[replaceIndex];
      original.corrections=original.corrections||[];
      original.corrections.push({...result,id:crypto.randomUUID(),label:`${original.label} • corrigida`});
    }setQuickProgress(100,'Pronto');if(status)status.innerHTML='<strong style="color:var(--good)">✓ Arte pronta.</strong>'+((state.user?.isAdmin&&image?.review)?`<span style="display:block;font-size:8px;color:var(--muted);margin-top:3px">${esc(inspectorDeliveryNote(image.review))}</span>`:'');const wrap=document.querySelector('#quickResultsWrap');if(wrap)wrap.innerHTML=renderQuickResultsHTML()+allArtworksHTML();bindQuickResultEvents();bindAllArtworksEvents();renderCostSupervisor();}catch(e){if(e.name==='AbortError'){if(status)status.textContent='Processamento cancelado.';setQuickProgress(0,'Cancelado');}else if(status)status.innerHTML=`<strong style="color:#ff9eac">Não foi possível concluir.</strong><br>${esc(e.message)}`;}finally{activeProcessController=null;btn.disabled=false;if(cancel)cancel.style.display='none';}}
async function runQuickAdaptation(sourceIndex,formatId,omit=[],darkScreen=false){scrollToGenerationPanel();const source=state.quickResults[sourceIndex];if(!source)return;const signal=beginProcess(),target=quickTargetSpec(formatId),status=document.querySelector('#quickStatus'),cancel=document.querySelector('#quickCancel');if(cancel)cancel.style.display='block';setQuickProgress(18,`Adaptando para ${target.label}...`);if(status)status.textContent='Processando sua arte...';try{const sourceRef=await prepareImageForAI(source.sourceUrl||source.dataUrl,1400,.9);const required={...source.requiredContent};omit.forEach(k=>{if(k==='pastorNames')required.pastorNames=[];else required[k]='';});const assets={...source.assets};if(omit.includes('logo'))assets.logo=null;if(omit.includes('pastors')){assets.pastor=null;assets.pastors=[];}if(omit.includes('churchImage'))assets.churchImage=null;const payload={mode:'adaptation',format:formatId,reference:sourceRef,references:[{image:sourceRef,note:'Preserve a identidade visual desta arte e adapte naturalmente para a nova proporção.'}],target,assets,requiredContent:required,instruction:source.instruction,finalInstruction:`Adapte o layout; não estique nem apenas recorte. Reorganize tipografia, pessoa e elementos para a nova proporção. SAFE FRAME RÍGIDO: 12% de margem livre em cada lado para TODO conteúdo essencial. Omitir explicitamente: ${omit.join(', ')||'nada'}. ${target.id==='screen'?`TELÃO: prefira o TÍTULO centralizado e dominante. Se houver foto de pregador, ilustração ou figura solicitada, use composição em dois polos: título à esquerda e imagem à direita OU título à direita e imagem à esquerda, escolhendo o lado de melhor equilíbrio. Não centralize título sobre o rosto.`:''} ${darkScreen?'VERSÃO ESCURA OBRIGATÓRIA: fundo e áreas dominantes devem ser escuros para telão/câmera de live; preserve contraste alto e, se houver foto da igreja, integre-a com opacidade visual reduzida, tratamento escuro e discreto, sem perder reconhecimento.':''} COMPOSIÇÃO LIMPA: não crie quadro/cartaz dentro de outro canvas sem referência ou ordem explícita. Evite caixas/cards/cápsulas desnecessários. Use a logo original uma única vez, limpa, sem caixa/placa/selo e nunca repita ou extraia partes dela.`,semanticMap:[],effects:[],artDirection:source.artDirection,typographyPlan:source.typographyPlan||null,redesign:false,variantLabel:`${source.label} • ${target.label}`};setQuickProgress(48,'Recompondo para o novo formato...');const image=await generateWithInvisibleReview(payload,1,signal);setQuickProgress(88,'Finalizando...');let dataUrl=await remoteToDataUrl(image.url);dataUrl=await resizeToTarget(dataUrl,target);source.adaptations=source.adaptations||[];source.adaptations.push({id:crypto.randomUUID(),format:formatId,target,dataUrl,sourceUrl:image.url,omit});setQuickProgress(100,'Pronto');if(status)status.innerHTML='<strong style="color:var(--good)">✓ Nova versão pronta.</strong>';const wrap=document.querySelector('#quickResultsWrap');if(wrap)wrap.innerHTML=renderQuickResultsHTML()+allArtworksHTML();bindQuickResultEvents();bindAllArtworksEvents();}catch(e){if(e.name==='AbortError'){if(status)status.textContent='Processamento cancelado.';setQuickProgress(0,'Cancelado');}else if(status)status.innerHTML=`<strong style="color:#ff9eac">Não foi possível adaptar.</strong><br>${esc(e.message)}`;}finally{activeProcessController=null;if(cancel)cancel.style.display='none';}}


next.onclick=()=>{if(state.step===steps.length-1){state.step=0;state.reference=null;state.layers=[];state.instruction='';render();return}state.step++;render()};back.onclick=()=>{if(state.step>0){state.step--;render()}};render();bootstrapLibrary().finally(()=>setTimeout(showModeChooser,150));

</script>
