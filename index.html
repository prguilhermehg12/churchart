function enableDraw(){
  const canvas=document.querySelector('#canvas');
  const overlay=document.querySelector('#interactionLayer');
  const img=canvas ? canvas.querySelector('img') : null;
  const cancelBtn=document.querySelector('#cancelDrawBtn');
  if(!canvas||!overlay)return;

  if(img){
    img.draggable=false;
    img.style.pointerEvents='none';
    img.style.userSelect='none';
    img.style.webkitUserDrag='none';
    img.ondragstart=()=>false;
  }

  let drawing=false;
  let origin=null;
  let draft=null;

  const point=e=>{
    const r=canvas.getBoundingClientRect();
    return {
      x:Math.max(0,Math.min(r.width,e.clientX-r.left)),
      y:Math.max(0,Math.min(r.height,e.clientY-r.top)),
      r
    };
  };

  const updateDraft=p=>{
    if(!drawing||!origin||!draft)return;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);
    Object.assign(draft.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
  };

  const cleanup=()=>{
    if(draft){draft.remove();draft=null;}
    drawing=false;
    origin=null;
    overlay.classList.remove('is-drawing');
    canvas.classList.remove('drawing-now');
    if(cancelBtn)cancelBtn.disabled=true;
  };

  const cancelSelection=()=>{
    if(!drawing)return;
    cleanup();
    showMapNotice('Seleção cancelada','Nenhuma camada foi criada. Você pode tentar novamente.','neutral');
  };

  const finish=e=>{
    if(!drawing)return;
    e.preventDefault();
    e.stopPropagation();
    const p=point(e);
    const r=origin.r;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);

    if(width<18||height<18){
      cleanup();
      showMapNotice('Seleção pequena demais','Clique e arraste envolvendo o elemento que deseja marcar.','neutral');
      return;
    }

    const select=document.querySelector('#layerType');
    const type=select?select.value:'other';
    const typeInfo=layerTypes.find(x=>x[0]===type)||layerTypes[layerTypes.length-1];
    const layer={
      id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
      type,
      typeLabel:typeInfo[1],
      name:guessName(type),
      color:colors[state.layers.length%colors.length],
      x:left/r.width*100,
      y:top/r.height*100,
      w:width/r.width*100,
      h:height/r.height*100,
      description:'',
      replacement:''
    };

    state.layers.push(layer);
    state.lastMarked=layer.id;
    const currentIndex=layerTypes.findIndex(x=>x[0]===type);
    state.nextLayerType=layerTypes[(currentIndex+1)%layerTypes.length][0];
    cleanup();
    screenMap();
  };

  overlay.addEventListener('mousedown',e=>{
    if(e.button!==0||drawing)return;
    e.preventDefault();
    e.stopPropagation();
    const p=point(e);
    origin={x:p.x,y:p.y,r:p.r};
    drawing=true;

    draft=document.createElement('div');
    draft.className='annotation drawing';
    draft.style.setProperty('--boxColor',colors[state.layers.length%colors.length]);
    Object.assign(draft.style,{left:p.x+'px',top:p.y+'px',width:'0px',height:'0px'});
    draft.innerHTML='<span>Selecionando…</span>';
    canvas.appendChild(draft);
    overlay.classList.add('is-drawing');
    canvas.classList.add('drawing-now');
    if(cancelBtn)cancelBtn.disabled=false;
  });

  overlay.addEventListener('mousemove',e=>{
    if(!drawing)return;
    e.preventDefault();
    updateDraft(point(e));
  });

  overlay.addEventListener('mouseup',finish);
  overlay.addEventListener('mouseleave',e=>{
    if(drawing) updateDraft(point(e));
  });

  window.addEventListener('mouseup',e=>{
    if(drawing) finish(e);
  });

  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&drawing){
      e.preventDefault();
      cancelSelection();
    }
  });


  const touchPoint=e=>{
    const t=e.touches?.[0]||e.changedTouches?.[0];if(!t)return null;
    return point({clientX:t.clientX,clientY:t.clientY});
  };
  overlay.addEventListener('touchstart',e=>{
    if(drawing)return;e.preventDefault();const p=touchPoint(e);if(!p)return;
    origin={x:p.x,y:p.y,r:p.r};drawing=true;
    draft=document.createElement('div');draft.className='annotation drawing';draft.style.setProperty('--boxColor',colors[state.layers.length%colors.length]);
    Object.assign(draft.style,{left:p.x+'px',top:p.y+'px',width:'0px',height:'0px'});draft.innerHTML='<span>Selecionando…</span>';
    canvas.appendChild(draft);overlay.classList.add('is-drawing');canvas.classList.add('drawing-now');if(cancelBtn)cancelBtn.disabled=false;
  },{passive:false});
  overlay.addEventListener('touchmove',e=>{if(!drawing)return;e.preventDefault();const p=touchPoint(e);if(p)updateDraft(p);},{passive:false});
  overlay.addEventListener('touchend',e=>{if(!drawing)return;e.preventDefault();const t=e.changedTouches?.[0];if(t)finish({preventDefault(){},stopPropagation(){},clientX:t.clientX,clientY:t.clientY});},{passive:false});

  if(cancelBtn)cancelBtn.onclick=cancelSelection;
}
function showMapNotice(title,text,tone='neutral'){
  const old=document.querySelector('.floating-map-notice');if(old)old.remove();

function fileToUrl(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}

async function optimizeImageFile(file,maxDim=1600,quality=.88){
  if(!file)return null;
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
  if(file.type==='image/png'&&file.size<900000)return raw;
  const img=await loadImage(raw);
  const scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',quality);
}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});}
async function overlayLogoOnImage(baseDataUrl,logoDataUrl,layer){
  const [base,logo]=await Promise.all([loadImageSafe(baseDataUrl),loadImageSafe(logoDataUrl)]);
  const c=document.createElement('canvas');c.width=base.naturalWidth;c.height=base.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(base,0,0,c.width,c.height);
  const box={x:(Number(layer.x)||0)/100*c.width,y:(Number(layer.y)||0)/100*c.height,w:(Number(layer.w)||20)/100*c.width,h:(Number(layer.h)||10)/100*c.height};
  const ratio=Math.min(box.w/logo.naturalWidth,box.h/logo.naturalHeight);const dw=logo.naturalWidth*ratio,dh=logo.naturalHeight*ratio;
  ctx.drawImage(logo,box.x+(box.w-dw)/2,box.y+(box.h-dh)/2,dw,dh);return c.toDataURL('image/png');
}

function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});}
async function remoteToDataUrl(src){
  if(!src||src.startsWith('data:')||src.startsWith('blob:'))return src;
  const r=await fetch(src,{mode:'cors',cache:'force-cache'});if(!r.ok)throw new Error(`Não foi possível carregar asset remoto (${r.status}).`);
  return blobToDataUrl(await r.blob());
}
async function loadImageSafe(src){return loadImage(await remoteToDataUrl(src));}
async function prepareImageForAI(src,maxDim=1280,quality=.8){
  const safe=await remoteToDataUrl(src);
  const img=await loadImage(safe);
  const scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',quality);
}

async function populateLayerCrops(){if(!state.reference)return;try{const img=await loadImageSafe(state.reference);document.querySelectorAll('[data-crop]').forEach(c=>{const l=state.layers.find(x=>x.id===c.dataset.crop);if(!l)return;const ctx=c.getContext('2d'),sx=Math.max(0,l.x/100*img.naturalWidth),sy=Math.max(0,l.y/100*img.naturalHeight),sw=Math.max(1,l.w/100*img.naturalWidth),sh=Math.max(1,l.h/100*img.naturalHeight);ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);});}catch(e){}}

async function callQualityInspector(payload){
  const r=await fetch('/api/quality-inspector',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const text=await r.text();let data;
  try{data=JSON.parse(text)}catch{throw new Error('Fiscal: resposta inválida.');}
  if(!r.ok)throw new Error(data.error||'Fiscal indisponível.');
  return data.review;
}
async function generateWithInvisibleReview(payload,maxCorrections=1){
  let lastReview=null,lastImage=null;
  const retryInstructions=[
    '',
    'Corrija apenas os erros apontados pelo fiscal. Preserve o restante da composição. Reduza qualquer transformação que possa alterar identidade, logo ou texto.',
    'Simplifique a composição. Preserve rosto, logo e informações exatamente. Evite efeitos complexos, sobreposições agressivas e deformações em áreas protegidas.',
    'MODO SEGURO: priorize fidelidade acima de criatividade. Use composição simples, limpa e profissional. Mantenha a pessoa com aparência praticamente fotográfica, logo intacta e todos os textos corretos. Não arrisque soluções experimentais.'
  ];

  for(let attempt=0;attempt<=maxCorrections;attempt++){
    const qualityCorrection=[
      retryInstructions[Math.min(attempt,retryInstructions.length-1)],
      lastReview?.correction_prompt||''
    ].filter(Boolean).join(' ');

    const request={...payload,qualityCorrection,revisionAttempt:attempt,safeMode:attempt>=3};

    const r=await fetch('/api/generate-art',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(request)
    });

    const text=await r.text();
    let data;
    try{data=JSON.parse(text)}
    catch{throw new Error(text.slice(0,180)||`Resposta inválida (${r.status})`);}
    if(!r.ok)throw new Error(data.error||`Erro ${r.status}`);

    lastImage=data.image;

    try{
      lastReview=await callQualityInspector({
        generatedImage:lastImage.url,
        references:payload.references||[],
        assets:payload.assets||{},
        requiredContent:payload.requiredContent||{},
        semanticMap:payload.semanticMap||[],
        userInstruction:payload.instruction||'',
        finalInstruction:payload.finalInstruction||'',
        artDirection:payload.artDirection||null
      });
    }catch(inspectorError){
      if(attempt>=2)return {...lastImage,review:{approved:true,critical_error:false,score:0,gross_errors:['Fiscal indisponível após múltiplas tentativas']}};
      continue;
    }

    if(lastReview.approved)return {...lastImage,review:lastReview};
    if(attempt<maxCorrections)continue;
  }

  return {...lastImage,review:lastReview||{approved:false,critical_error:false,score:0,gross_errors:['Entregue em modo seguro']}};
}

async function requestArtDirection(base){
  const r=await fetch('/api/design-director',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      references:base.references||[],semanticMap:base.semanticMap||[],church:base.church||{},
      instruction:base.instruction||'',finalInstruction:base.finalInstruction||'',
      effects:base.effects||[],format:base.format,target:primaryTargetSpec()
    })
  });
  const text=await r.text();let data;
  try{data=JSON.parse(text)}catch{throw new Error(text.slice(0,220)||`Diretor de arte: resposta inválida (${r.status})`);}
  if(!r.ok)throw new Error(data.error||`Diretor de arte: erro ${r.status}`);
  state.artDirection=data.artDirection||null;return state.artDirection;
}
function titleDirection(){return state.artDirection?.typography?.title||null;}
function normalizeHex(v,fallback='#ffffff'){return /^#[0-9a-f]{6}$/i.test(String(v||''))?v:fallback;}
function drawTrackedText(ctx,text,x,y,tracking){
  if(!tracking){ctx.fillText(text,x,y);return;}
  const chars=[...text],widths=chars.map(ch=>ctx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+tracking*(chars.length-1);let cursor=x-total/2;
  chars.forEach((ch,i)=>{ctx.fillText(ch,cursor+widths[i]/2,y);cursor+=widths[i]+tracking;});
}

function shouldKeepType(type,keep){
  if(!keep||keep.includes('all'))return true;
  if(type==='titlepart')type='title';
  return keep.includes(type);
}
function drawImageCover(ctx,img,w,h){
  const r=Math.max(w/img.naturalWidth,h/img.naturalHeight);
  const dw=img.naturalWidth*r,dh=img.naturalHeight*r;
  ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
}
async function composeProtectedFinal(bgDataUrl,variantIndex,target=primaryTargetSpec(),keep=['all']){
  const bg=await loadImageSafe(bgDataUrl);
  const c=document.createElement('canvas');c.width=target.width;c.height=target.height;
  const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  drawImageCover(ctx,bg,c.width,c.height);
  if(shouldKeepType('background',keep))await drawCreativeOverlays(ctx,c,variantIndex);
  const pastor=getSelectedPastor();const pastorLayer=state.layers.find(l=>l.type==='pastor');
  if(pastor&&pastorLayer&&shouldKeepType('pastor',keep))await drawAssetInBox(ctx,c,pastor.url,variantBox(pastorLayer,variantIndex),state.finalConfig.photoFilter,true);
  const logo=getSelectedLogo();const logoLayer=state.layers.find(l=>l.type==='logo');
  if(logo&&logoLayer&&shouldKeepType('logo',keep))await drawAssetInBox(ctx,c,logo.url,logoLayer,'original',false);
  for(const l of state.layers.filter(x=>['title','titlepart','subtitle','date','time','address'].includes(x.type))){
    const role=l.type==='titlepart'?'title':l.type;
    if(!l.replacement||!shouldKeepType(role,keep))continue;
    await drawTextLayer(ctx,c,l,l.replacement,fontFamilyFor(role));
  }
  if(!logo&&logoLayer&&state.church.name&&shouldKeepType('logo',keep))await drawTextLayer(ctx,c,{...logoLayer,type:'address'},state.church.name,fontFamilyFor('address'));
  return c.toDataURL('image/png');
}
function variantBox(l,i){if(state.finalConfig.positionMode!=='vary')return l;const shifts=[0,-6,6],scales=[1,1.08,.94];const s=scales[i]||1;return {...l,x:Math.max(0,Math.min(100-l.w*s,l.x+(shifts[i]||0))),w:l.w*s,h:l.h*s};}
async function drawAssetInBox(ctx,c,url,l,filter='original',cover=false){const img=await loadImageSafe(url);const x=l.x/100*c.width,y=l.y/100*c.height,w=l.w/100*c.width,h=l.h/100*c.height;const r=cover?Math.max(w/img.naturalWidth,h/img.naturalHeight):Math.min(w/img.naturalWidth,h/img.naturalHeight);const dw=img.naturalWidth*r,dh=img.naturalHeight*r,dx=x+(w-dw)/2,dy=y+(h-dh)/2;ctx.save();ctx.filter=canvasFilter(filter);ctx.drawImage(img,dx,dy,dw,dh);ctx.restore();}
async function drawTextLayer(ctx,c,l,text,fontFamily){
  const x=l.x/100*c.width,y=l.y/100*c.height,w=l.w/100*c.width,h=l.h/100*c.height;
  const role=l.type==='titlepart'?'title':l.type,td=role==='title'?titleDirection():null;
  let value=String(text||'');if(td?.uppercase)value=value.toUpperCase();
  let size=Math.max(12,Math.floor(h*(role==='title'?(Number(td?.scale)||.82):.7)));
  ctx.save();ctx.translate(x+w/2,y+h/2);if(role==='title'&&td?.rotation)ctx.rotate(Number(td.rotation)*Math.PI/180);
  ctx.textBaseline='middle';ctx.textAlign='center';ctx.font=`900 ${size}px ${fontFamily}`;
  while(size>10&&ctx.measureText(value).width>w*(role==='title'?1.12:.96)){size-=2;ctx.font=`900 ${size}px ${fontFamily}`;}
  const palette=state.artDirection?.palette||{};
  ctx.fillStyle=role==='title'?normalizeHex(td?.fill||palette.accent||palette.foreground,'#ffffff'):normalizeHex(palette.foreground,'#ffffff');
  const shadowStrength=Number(td?.shadow)||.55;ctx.shadowColor=`rgba(0,0,0,${Math.max(0,Math.min(.9,shadowStrength))})`;
  ctx.shadowBlur=Math.max(2,size*(role==='title'?.12:.08));ctx.shadowOffsetX=role==='title'?Math.round(size*.04):0;ctx.shadowOffsetY=role==='title'?Math.round(size*.05):0;
  if(role==='title'&&td?.outline){ctx.lineWidth=Math.max(1,size*(Number(td.outlineWidth)||.035));ctx.strokeStyle=normalizeHex(td.outlineColor||palette.background,'#111111');ctx.strokeText(value,0,0,w*1.18);}
  const tracking=role==='title'?Math.round(size*(Number(td?.tracking)||0)):0;drawTrackedText(ctx,value,0,0,tracking);ctx.restore();
}
async function drawCreativeOverlays(ctx,c,variantIndex){const ids=state.finalConfig.selectedElements;let n=0;for(const id of ids){if(id.startsWith('asset:')){const a=state.library.assets.find(x=>x.id===id.slice(6));if(a){const box={x:5+(n*17)%70,y:8+(n*23)%70,w:22,h:22};await drawAssetInBox(ctx,c,a.url,box,'original',false);n++;}}}}

async function quickPayload(variantLabel='Principal',correction=''){
  const ref=state.quick.reference?await prepareImageForAI(state.quick.reference,1400,.88):null;

  };
  const refs=ref?[{image:ref,note:'Use esta arte como referência principal de composição, tipografia, paleta, recortes, textura e linguagem visual.'}]:[];
  const base={
    church:{name:state.church.name,address:state.quick.address||state.church.address,hasLogo:!!assets.logo},

async function runQuickGeneration(label,variationIndex,correction=''){
  const status=document.querySelector('#quickStatus'),box=document.querySelector('#quickResult'),btn=document.querySelector('#quickGenerate');
  btn.disabled=true;status.textContent='Processando sua arte...';
  try{
    const payload=await quickPayload(label,correction);
    payload.variantId=`quick-${variationIndex}`;payload.variantLabel=label;payload.variantInstruction=variationIndex===0?'Siga a referência com fidelidade.':`Crie uma variação de layout ${variationIndex}, mantendo a mesma linguagem e todos os dados.`;
    const image=await generateWithInvisibleReview(payload,1);
    const dataUrl=await remoteToDataUrl(image.url);
    box.innerHTML=`<img src="${dataUrl}"><div class="quick-actions"><button class="mini-btn download-btn" id="qDownload">↓ Baixar</button>${variationIndex<2?`<button class="mini-btn" id="qVariation">Gerar variação ${variationIndex+1}</button>`:''}<button class="mini-btn" id="qReload">↻ Corrigir / redesenhar</button></div><div class="field" style="margin-top:10px"><label>Correção desta arte</label><textarea id="qCorrection" placeholder="Ex.: mova o título para baixo, simplifique o fundo, mantenha o rosto exatamente igual..."></textarea></div>`;
    document.querySelector('#qDownload').onclick=()=>downloadDataUrl(dataUrl,`churchdesign-${label.toLowerCase().replace(/\s+/g,'-')}.png`);
    const v=document.querySelector('#qVariation');if(v)v.onclick=()=>runQuickGeneration(`Variação ${variationIndex+1}`,variationIndex+1);
    document.querySelector('#qReload').onclick=()=>runQuickGeneration(label,variationIndex,document.querySelector('#qCorrection').value);
    status.innerHTML='<strong style="color:var(--good)">✓ Arte pronta.</strong>';
  }catch(e){status.innerHTML=`<strong style="color:#ff9eac">Não foi possível concluir.</strong><br>${esc(e.message)}`;}
  finally{btn.disabled=false;}
}
