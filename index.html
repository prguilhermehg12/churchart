/* V0.6 */
.art-canvas.format-feed{aspect-ratio:4/5;min-height:0}

.download-btn{border-color:#315f49;color:#c6f5d9;background:#102419}
.selected-bar{display:none;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;margin:0 0 18px;border:1px solid #2c6e4d;background:#10241a;border-radius:14px}
.selected-bar.show{display:flex}
.selected-bar strong,.selected-bar span{display:block}
.selected-bar strong{font-size:13px;color:#c9f5da}
.selected-bar span{font-size:10px;color:#8db7a0;margin-top:3px}
.gallery-section{margin-top:30px}
.gallery-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gallery-item{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d0f13}

@media(max-width:650px){.gallery-grid{grid-template-columns:1fr}.selected-bar{align-items:flex-start;flex-direction:column}}

/* V0.8 — mobile, referências, previews, loading */

.event-logo-guide:before{left:27%!important;right:27%!important;top:20%!important;bottom:20%!important}
.event-logo-pos{width:24px!important;height:16px!important}
.event-logo-pos[data-event-pos="left-top"]{left:29%!important;top:27%!important}
.event-logo-pos[data-event-pos="right-top"]{right:29%!important;top:27%!important}
.event-logo-pos[data-event-pos="left-middle"]{left:29%!important;top:46%!important}
.event-logo-pos[data-event-pos="right-middle"]{right:29%!important;top:46%!important}
.event-logo-pos[data-event-pos="left-bottom"]{left:29%!important;bottom:27%!important}
.event-logo-pos[data-event-pos="right-bottom"]{right:29%!important;bottom:27%!important}
.event-logo-size-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;max-width:390px}
.event-logo-size-card{border:1px solid var(--line);background:#11141a;border-radius:10px;padding:8px;cursor:pointer;min-width:0}
.event-logo-size-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#1a1318}
.event-logo-size-canvas{position:relative;width:100%;aspect-ratio:4/5;background:#1b2029;border-radius:6px;overflow:hidden;margin-bottom:6px}
.event-logo-size-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:8%;border-radius:3px;background:#f2f3f5;opacity:.92}
.event-logo-size-card[data-event-size="small"] .event-logo-size-mark{width:14%}
.event-logo-size-card[data-event-size="medium"] .event-logo-size-mark{width:20%}
.event-logo-size-card[data-event-size="large"] .event-logo-size-mark{width:26%}
.event-logo-size-card strong{font-size:9px;display:block;text-align:center}.event-logo-size-card small{font-size:7px;color:var(--muted);display:block;text-align:center;margin-top:2px}
.church-logo-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.church-logo-option{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#11141a;border-radius:9px;padding:9px;font-size:9px;cursor:pointer}
.church-logo-option input{accent-color:var(--accent)}


/* V0.28.5 — hierarquia de até 3 pregadores */
.quick-asset[data-qpastor]{position:relative}
.pastor-rank-badge{
  position:absolute;left:6px;top:6px;z-index:3;
  padding:4px 6px;border-radius:7px;background:rgba(7,9,12,.88);
  border:1px solid #596273;color:#fff;font-size:7px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;pointer-events:none
}
.quick-asset.multi-selected[data-pastor-rank="0"]{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(255,76,114,.3) inset}
.quick-asset.multi-selected[data-pastor-rank="1"],
.quick-asset.multi-selected[data-pastor-rank="2"]{border-color:#697386!important}
.pastor-order-summary{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 9px}
.pastor-order-pill{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:#11141a;color:#cfd5df}
.pastor-order-pill b{color:white}


/* NEWFLOW v0.2 — Assistente manual de logos */
.logo-assistant-overlay{position:fixed;inset:0;z-index:150000;background:rgba(4,6,10,.96);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.logo-assistant-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:#0d1015}.logo-assistant-head h2{font-size:16px;margin:0}.logo-assistant-head small{display:block;color:var(--muted);margin-top:3px}
.logo-assistant-body{min-height:0;display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:14px;padding:14px}.logo-assistant-panel{position:relative;z-index:5;pointer-events:auto;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#0f1217;padding:14px}.logo-assistant-stage-wrap{position:relative;z-index:4;pointer-events:auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#080a0d;padding:12px}
.logo-assistant-stage{position:relative;line-height:0;box-shadow:0 20px 70px rgba(0,0,0,.45);overflow:hidden;background:#111;touch-action:none}.logo-assistant-stage>img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.logo-palette-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#cfd5df;margin:4px 0 8px}.logo-palette{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.logo-palette-item{appearance:none;width:100%;color:inherit;text-align:left;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:#151922;cursor:grab;min-width:0;touch-action:none;position:relative;z-index:2}.logo-palette-item:hover{border-color:#555e70}.logo-palette-item.is-pointer-dragging{opacity:.55;cursor:grabbing}.logo-drag-ghost{position:fixed;z-index:170000;width:92px;height:70px;pointer-events:none;border:1px solid #687386;border-radius:10px;background:#151922;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.5)}.logo-drag-ghost img{width:100%;height:100%;object-fit:contain}.logo-palette-item .logo-preview-surface{height:64px}.logo-palette-item strong,.logo-palette-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logo-palette-item strong{font-size:9px;margin-top:6px}.logo-palette-item small{font-size:8px;color:var(--muted);margin-top:2px}
.manual-logo-node{position:absolute;line-height:normal;cursor:move;touch-action:none;user-select:none}.manual-logo-node img{display:block;width:100%;height:auto;pointer-events:none;filter:none}.manual-logo-node.selected{outline:2px solid #fff;outline-offset:3px}.manual-logo-node .slot-tag{position:absolute;left:0;top:-20px;background:#fff;color:#111;font-size:8px;font-weight:900;padding:3px 5px;border-radius:5px;line-height:1}
.logo-assistant-controls{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}.logo-assistant-controls label{display:block;font-size:9px;color:#cfd5df;margin-bottom:6px}.logo-assistant-controls input[type=range]{width:100%;pointer-events:auto;touch-action:pan-x;position:relative;z-index:6}.logo-assistant-actions{display:grid;gap:8px;margin-top:16px}.logo-assistant-actions .btn{width:100%}.logo-assistant-version{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);text-align:center;font-size:8px;color:var(--muted);letter-spacing:.08em}.logo-assistant-note{font-size:9px;color:var(--muted);line-height:1.5;margin:8px 0 12px}.flow-badge{display:inline-flex;align-items:center;border:1px solid #3c4655;border-radius:99px;padding:4px 8px;font-size:8px;color:#cbd2df;margin-bottom:8px}.proceed-btn{border-color:#7d6cff!important;background:#1b1830!important;color:#e7e2ff!important}
@media(max-width:850px){.logo-assistant-body{grid-template-columns:1fr;overflow:auto}.logo-assistant-stage-wrap{min-height:420px}.logo-assistant-stage{max-width:92vw}.logo-palette{grid-template-columns:repeat(3,1fr)}}


/* NEWFLOW v0.40 — authentication */
.auth-gate{position:fixed;inset:0;z-index:10000;background:#090b0f;display:grid;place-items:center;padding:20px}
.auth-gate.hidden{display:none}.auth-card{width:min(430px,96vw);background:#111318;border:1px solid #2a2e37;border-radius:20px;padding:26px;box-shadow:0 30px 100px rgba(0,0,0,.55)}

.account-signout{width:100%;margin-top:10px}.account-email{display:block;color:#969dac;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}

/* NEWFLOW v0.40 — Telão occupancy selector + Modo Livre */
.screen-occupancy-block{grid-column:1/-1;margin-top:4px;padding:12px;border:1px solid var(--field-border);background:var(--soft-surface);border-radius:12px}
.screen-occupancy-block>strong{display:block;font-size:10px;margin-bottom:4px}
.screen-occupancy-block>small{display:block;color:var(--muted);font-size:8px;line-height:1.45;margin-bottom:10px}
.screen-occupancy-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.screen-occupancy-option{border:1px solid var(--field-border);background:var(--field-bg);border-radius:10px;padding:7px;cursor:pointer;text-align:center;color:var(--text)}
.screen-occupancy-option.active{border-color:var(--brand-orange);box-shadow:0 0 0 2px rgba(255,106,0,.13)}
.screen-occupancy-preview{height:54px;border-radius:7px;background:var(--field-bg-2);position:relative;overflow:hidden;margin-bottom:5px;border:1px solid var(--field-border)}
.screen-occupancy-preview i{position:absolute;display:block;border-radius:3px;background:var(--brand-orange);opacity:.88;left:50%;transform:translateX(-50%)}
.screen-occupancy-option[data-screen-occupancy="5"] i{width:30%;height:7%;bottom:8%}
.screen-occupancy-option[data-screen-occupancy="20"] i{width:38%;height:25%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option[data-screen-occupancy="30"] i{width:48%;height:35%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option[data-screen-occupancy="40"] i{width:58%;height:45%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option[data-screen-occupancy="50"] i{width:68%;height:55%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option b{font-size:9px}
.free-mode-box{padding:13px;border:1px solid var(--field-border);background:var(--soft-surface);border-radius:12px}
.free-mode-formats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0}
.free-format-option{border:1px solid var(--field-border);background:var(--field-bg);color:var(--text);border-radius:9px;padding:8px 5px;font-size:8px;font-weight:800;cursor:pointer}

.free-mode-box textarea{width:100%;min-height:120px;margin-top:7px}

const COST_RATES={
  'gpt-5.6-sol':{input:5, cached:0.5, output:30, kind:'text'},
  'gpt-5.6':{input:5, cached:0.5, output:30, kind:'text'},

  'gpt-image-2':{text_input:5,text_cached:1.25,text_output:10,image_input:8,image_cached:2,image_output:30,kind:'image'}
};
function beginCostSession(label='Criação'){
  state.costSupervisor={sessionId:crypto.randomUUID(),startedAt:Date.now(),events:[],label,currency:'USD'};

function usageNum(obj,...paths){
  for(const path of paths){
    let v=obj;
    for(const k of path.split('.'))v=v?.[k];
    if(Number.isFinite(Number(v)))return Number(v);
  }
  return 0;
}
function estimateUsageCost(model,usage,toolUsage=null){
  if(!usage&&!toolUsage)return {usd:0,estimated:true,note:'usage indisponível'};
  const r=COST_RATES[model]||COST_RATES['gpt-5.6-sol'];
  if(r.kind==='text'){
    const input=usageNum(usage,'input_tokens','prompt_tokens');
    const output=usageNum(usage,'output_tokens','completion_tokens');
    const cached=usageNum(usage,'input_tokens_details.cached_tokens','prompt_tokens_details.cached_tokens');
    const uncached=Math.max(0,input-cached);
    return {usd:(uncached*r.input+cached*r.cached+output*r.output)/1e6,estimated:false,input,output,cached};
  }
  const u=toolUsage||usage||{};
  const ti=usageNum(u,'input_tokens_details.text_tokens','input_details.text_tokens','text_input_tokens');
  const ii=usageNum(u,'input_tokens_details.image_tokens','input_details.image_tokens','image_input_tokens');
  const ci=usageNum(u,'input_tokens_details.cached_tokens','input_details.cached_tokens');
  const to=usageNum(u,'output_tokens_details.text_tokens','output_details.text_tokens','text_output_tokens');
  const io=usageNum(u,'output_tokens_details.image_tokens','output_details.image_tokens','image_output_tokens');
  const input=usageNum(u,'input_tokens','prompt_tokens');
  const output=usageNum(u,'output_tokens','completion_tokens');
  if(ti||ii||to||io){
    const imageCached=Math.min(ii,ci),textCached=Math.max(0,ci-imageCached);
    const usd=((Math.max(0,ti-textCached)*r.text_input)+(textCached*r.text_cached)+(Math.max(0,ii-imageCached)*r.image_input)+(imageCached*r.image_cached)+(to*r.text_output)+(io*r.image_output))/1e6;
    return {usd,estimated:false,input,output,textInput:ti,imageInput:ii,textOutput:to,imageOutput:io,cached:ci};
  }
  // Se a API não detalhar modalidade, usamos todos os tokens de entrada como imagem e saída como imagem:
  // é deliberadamente conservador para o supervisor não subestimar gasto.
  return {usd:(input*r.image_input+output*r.image_output)/1e6,estimated:true,input,output,note:'modalidade estimada'};
}

    usage:meta.usage||null,
    toolUsage:meta.toolUsage||null,
    at:Date.now()
  };
  state.costSupervisor.requests.push(item);
  recordCostEvent(stage,meta);
}

  if(!state.costSupervisor?.sessionId)beginCostSession('Criação');
  const model=meta.model||meta.modelUsed||'desconhecido';
  const calc=estimateUsageCost(model,meta.usage||null,meta.toolUsage||null);
  state.costSupervisor.events.push({
    id:crypto.randomUUID(),stage,model,usd:calc.usd||0,estimated:!!calc.estimated,
    input:calc.input||0,output:calc.output||0,cached:calc.cached||0,note:calc.note||'',at:Date.now()
  });
  renderCostSupervisor();
}

async function fetchActualOpenAICost(startMs,endMs=Date.now()){
  try{
    const r=await authFetch(`/api/openai-costs?start=${Math.floor(startMs/1000)}&end=${Math.floor(endMs/1000)}`);
    const d=await r.json();
    if(r.ok&&Number.isFinite(Number(d.cost))){
      state.costSupervisor.actualCost=Number(d.cost);
      state.costSupervisor.actualEnd=endMs;
      renderCostSupervisor();
      return Number(d.cost);
    }
  }catch{}
  return null;
}
function scheduleActualCostReconcile(){
  if(!state.user?.isAdmin||!state.costSupervisor?.startedAt)return;
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),5000);
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),20000);

function enableDraw(){
  const canvas=document.querySelector('#canvas');
  const overlay=document.querySelector('#interactionLayer');
  const img=canvas ? canvas.querySelector('img') : null;
  const cancelBtn=document.querySelector('#cancelDrawBtn');
  if(!canvas||!overlay)return;

  if(img){
    img.draggable=false;
    img.style.pointerEvents='none';
    img.style.userSelect='none';
    img.style.webkitUserDrag='none';
    img.ondragstart=()=>false;
  }

  let drawing=false;
  let origin=null;
  let draft=null;

  const point=e=>{
    const r=canvas.getBoundingClientRect();
    return {
      x:Math.max(0,Math.min(r.width,e.clientX-r.left)),
      y:Math.max(0,Math.min(r.height,e.clientY-r.top)),
      r
    };
  };

  const updateDraft=p=>{
    if(!drawing||!origin||!draft)return;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);
    Object.assign(draft.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});

async function optimizeImageFile(file,maxDim=1600,quality=.88,preserveAlpha=false){
  if(!file)return null;
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
  if(file.type==='image/png'&&file.size<900000)return raw;
  const img=await loadImage(raw);
  const scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  return preserveAlpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',quality);
}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();if(src&&!String(src).startsWith('data:')&&!String(src).startsWith('blob:'))img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});}
async function overlayLogoOnImage(baseDataUrl,logoDataUrl,layer){
  const [base,logo]=await Promise.all([loadImageSafe(baseDataUrl),loadImageSafe(logoDataUrl)]);
  const c=document.createElement('canvas');c.width=base.naturalWidth;c.height=base.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(base,0,0,c.width,c.height);
  const box={x:(Number(layer.x)||0)/100*c.width,y:(Number(layer.y)||0)/100*c.height,w:(Number(layer.w)||20)/100*c.width,h:(Number(layer.h)||10)/100*c.height};
  const ratio=Math.min(box.w/logo.naturalWidth,box.h/logo.naturalHeight);const dw=logo.naturalWidth*ratio,dh=logo.naturalHeight*ratio;
  ctx.drawImage(logo,box.x+(box.w-dw)/2,box.y+(box.h-dh)/2,dw,dh);return c.toDataURL('image/png');
}
function computePreferenceProfile(){
  const ratings=state.library.ratings||[];if(!ratings.length)return null;
  const buckets={design_style:{},inspiration_style:{},effect:{},audience:{}};
  ratings.forEach((r,i)=>{const weight=(Number(r.rating)||3)-3;const recency=1+Math.max(0,(ratings.length-i)/Math.max(1,ratings.length))*.15;for(const k of Object.keys(buckets)){const v=r[k];if(v)buckets[k][v]=(buckets[k][v]||0)+weight*recency;}});
  const top=k=>Object.entries(buckets[k]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
  return {designStyle:top('design_style'),inspirationStyle:top('inspiration_style'),effect:top('effect'),audience:top('audience')};
}

async function downloadDataUrl(dataUrl,filename,meta={}){
  try{
    let blob=null;
    if(String(dataUrl).startsWith('data:')){
      const comma=dataUrl.indexOf(','),head=dataUrl.slice(0,comma),raw=dataUrl.slice(comma+1),mime=(head.match(/^data:([^;,]+)/)||[])[1]||'image/png';
      if(/;base64/i.test(head)){const bin=atob(raw),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);blob=new Blob([bytes],{type:mime});}
      else blob=new Blob([decodeURIComponent(raw)],{type:mime});
    }else{
      try{const r=await fetch(dataUrl,{cache:'no-store'});if(r.ok)blob=await r.blob();}catch(_){ }
      if(!blob){const local=await remoteToDataUrl(dataUrl);return downloadDataUrl(local,filename,meta);}
    }
    if(!blob||!blob.size)throw new Error('Arquivo de imagem vazio.');
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename||'churchdesign.png';a.rel='noopener';a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);if(!meta?.silentRating)setTimeout(()=>showRatingPopup(meta),450);return true;
  }catch(e){console.error('downloadDataUrl',e);showMapNotice('Não foi possível baixar','Tente novamente. A imagem continua salva nesta tela.');return false;}
}

const AUTH_STORAGE_KEY='churchdesign.auth.v1';

async function loadAuthConfig(){

async function authRequest(path,body){

  return d;

async function refreshAuthSession(session){

    if(d?.access_token){saveAuthSession(d);return d}
  }catch(e){console.warn('[Auth] refresh failed',e)}

}
async function fetchAuthUser(session){

async function completeAuth(session){

  if(!user){active=await refreshAuthSession(active);user=await fetchAuthUser(active)}
  if(!user)throw new Error('Sessão expirada. Entre novamente.');

}
function oauthSessionFromHash(){

}

async function resizeToTarget(dataUrl,target){

  // Pequenas diferenças técnicas são normalizadas por cover.
  // Diferença grande NÃO causa retry nem erro: preservamos a arte paga e marcamos

}

async function startAuthenticatedApp(){
  if(churchDesignAppStarted)return;churchDesignAppStarted=true;
  try{await ensureChurchAccountContext();await loadActiveChurchAccess();await bootstrapLibrary();state.mode='quick';updateSidebarAccount();renderChurchSwitcher();screenQuickMode()}catch(e){churchDesignAppStarted=false;console.error('[ChurchDesign] start',e);appAlert(e.message||'Falha ao iniciar o ChurchDesign.',{type:'error'})}
}
document.querySelector('#authForm')?.addEventListener('submit',handleAuthSubmit);
document.querySelector('#googleLoginBtn')?.addEventListener('click',loginWithGoogle);
document.querySelector('#authSwitchBtn')?.addEventListener('click',()=>setAuthMode(authMode==='login'?'signup':'login'));
initChurchDesignTheme();
initializeAuth().then(ok=>{if(ok)startAuthenticatedApp()}).catch(e=>{showAuthGate();authMessage(e.message||'Falha ao iniciar autenticação.')});

</script>
</body>
</html>
