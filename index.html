  <style>

/* V0.1 — seleção de contornos */
.canvas-toolbar select{background:#151820;color:white;border:1px solid #303642;border-radius:8px;padding:8px 10px;outline:none}.art-canvas.is-drawable{cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none}.art-canvas.is-drawable *{-webkit-user-drag:none}.art-canvas.is-drawable img{pointer-events:none;user-select:none;-webkit-user-drag:none}.art-canvas.drawing-now{cursor:crosshair}.annotation.drawing{z-index:50;border-style:dashed;background:color-mix(in srgb,var(--boxColor) 16%,transparent);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}.annotation.saved{z-index:10;border-width:2px;box-shadow:0 0 0 1px color-mix(in srgb,var(--boxColor) 35%,transparent),0 0 20px color-mix(in srgb,var(--boxColor) 16%,transparent)}.annotation.saved.just-saved{animation:savedPulse .75s ease-out}.annotation .handle{display:none}.annotation.saved .handle{display:block;position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--boxColor);box-shadow:0 1px 4px rgba(0,0,0,.4)}.annotation .h1{left:-5px;top:-5px}.annotation .h2{right:-5px;top:-5px}.annotation .h3{left:-5px;bottom:-5px}.annotation .h4{right:-5px;bottom:-5px}@keyframes savedPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--boxColor) 65%,transparent)}70%{box-shadow:0 0 0 12px color-mix(in srgb,var(--boxColor) 0%,transparent)}100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--boxColor) 35%,transparent)}}.map-success{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;margin-bottom:16px;padding:13px 14px;border:1px solid #24553f;background:linear-gradient(90deg,#10291e,#111820);border-radius:13px;animation:successIn .25s ease-out}.success-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#153b2a;color:var(--good);border:1px solid #2f815b;font-weight:900}.map-success strong,.map-success span{display:block}.map-success strong{font-size:13px;color:#dff8eb}.map-success span{font-size:11px;color:#94bfa8;margin-top:3px}.success-close{border:0;background:transparent;color:#7f9d8d;font-size:20px;cursor:pointer}.canvas-status{display:flex;gap:10px;align-items:center;padding:12px 4px 0;color:var(--muted)}.canvas-status .status-check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#171a20;border:1px solid var(--line);font-weight:900}.canvas-status strong,.canvas-status span{display:block}.canvas-status strong{font-size:11px;color:#d6dbe5}.canvas-status span{font-size:10px;margin-top:2px}.canvas-status.has-layers .status-check{background:#143123;border-color:#276b4a;color:var(--good)}.canvas-status.has-layers strong{color:#bff1d3}.layers-heading{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:15px}.layers-heading p{margin-top:4px}.layer-count{min-width:28px;height:28px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:#20242d;border:1px solid #333947;color:#dce1eb;font-size:11px;font-weight:800}.layer.layer-new{border-color:#2a6c4c;background:#0e1d17}.saved-badge{font-size:9px;color:var(--good);background:#112b1f;border:1px solid #235c40;border-radius:99px;padding:4px 7px;white-space:nowrap}@keyframes successIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* V0.2 — cancelamento e feedback da seleção */
.toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.cancel-draw-btn{border-color:#6b3840;color:#ff9eac;background:#211217}.cancel-draw-btn:not(:disabled):hover{background:#321820;border-color:#a54a5b}.cancel-draw-btn:disabled{opacity:.35;cursor:not-allowed}.undo-last-btn:hover{border-color:#596175;background:#20242d}.success-actions{display:flex;align-items:center;gap:8px}.success-undo{color:#bff1d3;border-color:#2a6c4c;background:#10251a}.success-undo:hover{background:#173824}.floating-map-notice{position:fixed;right:28px;bottom:92px;z-index:1000;min-width:290px;max-width:380px;padding:13px 15px;border-radius:12px;background:#171a20;border:1px solid #343a46;box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;transform:translateY(10px);transition:.2s ease}.floating-map-notice.show{opacity:1;transform:none}.floating-map-notice strong,.floating-map-notice span{display:block}.floating-map-notice strong{font-size:12px;color:#eef1f6}.floating-map-notice span{font-size:10px;color:#a7aebb;margin-top:4px}.floating-map-notice.neutral{border-color:#4b5362}.art-canvas.drawing-now:after{content:'Arraste para ajustar • solte para salvar • Esc para cancelar';position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:80;padding:8px 11px;border-radius:99px;background:rgba(10,12,16,.88);border:1px solid rgba(255,255,255,.16);color:#e7eaf0;font-size:10px;font-weight:700;white-space:nowrap;pointer-events:none}


/* BUILD V0.4 — interaction overlay */
.interaction-layer{position:absolute;inset:0;z-index:60;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none;background:transparent}
.interaction-layer.is-drawing{cursor:crosshair}
.annotation.saved{z-index:40}
.annotation.drawing{z-index:70}
.build-stamp{position:fixed;left:282px;bottom:12px;z-index:1200;padding:6px 9px;border-radius:8px;border:1px solid #38404d;background:rgba(12,14,18,.94);color:#9fa8b8;font-size:10px;font-weight:800;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.28);pointer-events:none}
@media(max-width:900px){.build-stamp{left:12px;bottom:76px}}

/* V0.6 */
.art-canvas.format-feed{aspect-ratio:4/5;min-height:0}
.art-canvas.format-story{aspect-ratio:9/16;min-height:0;max-height:720px;margin:auto}
.art-canvas.format-wide{aspect-ratio:16/9;min-height:0}
.result-card.selected-result{border-color:var(--good);box-shadow:0 0 0 2px rgba(89,214,154,.25),var(--shadow)}
.result-actions{display:flex;gap:7px;align-items:center}
.download-btn{border-color:#315f49;color:#c6f5d9;background:#102419}
.selected-bar{display:none;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;margin:0 0 18px;border:1px solid #2c6e4d;background:#10241a;border-radius:14px}
.selected-bar.show{display:flex}
.selected-bar strong,.selected-bar span{display:block}
.selected-bar strong{font-size:13px;color:#c9f5da}
.selected-bar span{font-size:10px;color:#8db7a0;margin-top:3px}
.gallery-section{margin-top:30px}
.gallery-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gallery-item{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d0f13}
.gallery-item img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#090a0c}
.gallery-item.wide img{aspect-ratio:16/9}
.gallery-item.story img{aspect-ratio:9/16}
.gallery-meta{padding:9px 10px}
.gallery-meta strong,.gallery-meta small{display:block}
.gallery-meta strong{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-meta small{font-size:9px;color:var(--muted);margin-top:3px}
.gallery-empty{border:1px dashed var(--line);border-radius:13px;padding:25px;text-align:center;color:var(--muted);font-size:11px}
.generation-note{margin-top:10px;color:#aab1bf;font-size:10px;line-height:1.5}
@media(max-width:1050px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.gallery-grid{grid-template-columns:1fr}.selected-bar{align-items:flex-start;flex-direction:column}}





/* V0.31.5 — diagnóstico visual de logos */
.logo-diagnostic-overlay{position:fixed;inset:0;z-index:130000;background:rgba(3,5,8,.96);display:flex;flex-direction:column;padding:12px}
.logo-diagnostic-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;margin-bottom:10px}
.logo-diagnostic-head h3{margin:0;font-size:14px}
.logo-diagnostic-actions{display:flex;gap:7px;flex-wrap:wrap}
.logo-diagnostic-body{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,.8fr);gap:12px;min-height:0;flex:1}
.logo-diagnostic-stage-wrap{min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;border:1px solid #2c3543;border-radius:12px;background:#080b10;padding:10px}
.logo-diagnostic-stage{position:relative;display:inline-block;line-height:0;max-width:100%;max-height:100%}

.logo-diag-box{position:absolute;box-sizing:border-box;border:2px solid currentColor;background:rgba(255,255,255,.02);pointer-events:none}

.logo-diag-person{color:#ff6679}.logo-diag-face{color:#ff9b66}.logo-diag-hand{color:#ffc766}.logo-diag-microphone,.logo-diag-instrument{color:#d58cff}
.logo-diag-text_title,.logo-diag-text_subtitle,.logo-diag-text_date,.logo-diag-text_address,.logo-diag-text_other{color:#68c5ff}
.logo-diag-graphic_focus{color:#88e28f}
.logo-diag-plan{color:#fff;border-style:dashed;border-width:3px;background:rgba(255,255,255,.07)}
.logo-diag-plan-event{color:#f2a6ff}.logo-diag-plan-church{color:#fff08d}
.logo-diagnostic-panel{min-height:0;overflow:auto;border:1px solid #2c3543;border-radius:12px;background:#0d1118;padding:12px;color:#e9eef7}
.logo-diagnostic-panel h4{margin:0 0 7px;font-size:11px}
.logo-diagnostic-panel pre{white-space:pre-wrap;word-break:break-word;background:#080b10;border:1px solid #252e3c;border-radius:9px;padding:9px;font-size:9px;line-height:1.45;max-height:38vh;overflow:auto}
.logo-diag-summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.logo-diag-chip{border:1px solid #2b3544;border-radius:9px;padding:7px;background:#111722}
.logo-diag-chip strong{display:block;font-size:9px}.logo-diag-chip small{display:block;margin-top:2px;color:#9ba7b8;font-size:8px}
.logo-diag-warning{border:1px solid #70533d;background:#231a12;color:#ffd19c;border-radius:9px;padding:8px;margin-bottom:9px;font-size:9px;line-height:1.4}
.logo-diag-good{border:1px solid #315e47;background:#102019;color:#a8e6bd;border-radius:9px;padding:8px;margin-bottom:9px;font-size:9px;line-height:1.4}
@media(max-width:900px){.logo-diagnostic-body{grid-template-columns:1fr}.logo-diagnostic-panel{max-height:42vh}}
/* V0.32.0 — logo preview contrast + screen title modes */
.logo-preview-surface{height:100px;border-radius:9px;border:1px solid #303641;display:grid;place-items:center;overflow:hidden;transition:background .18s ease}
.logo-preview-surface img{width:100%!important;height:100%!important;object-fit:contain!important;background:transparent!important}
.screen-title-mode{grid-column:1/-1;border:1px solid #394354;border-radius:10px;padding:10px;background:#0d1016;display:grid;gap:8px}
.screen-title-mode label{display:flex;align-items:center;gap:7px;font-size:9px;color:#d3d9e4}
.screen-title-mode small{font-size:8px;color:var(--muted);line-height:1.45}


/* V0.31.2 — visualização em tela cheia */
.art-fullscreen-overlay{position:fixed;inset:0;z-index:120000;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.art-fullscreen-toolbar{width:min(96vw,1600px);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;color:#fff}
.art-fullscreen-toolbar strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-fullscreen-close{border:1px solid #4d5668;background:#161b24;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}
.art-fullscreen-stage{width:96vw;height:90vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art-fullscreen-stage img{display:block;max-width:96vw;max-height:90vh;width:auto;height:auto;object-fit:contain;box-shadow:0 16px 50px rgba(0,0,0,.55)}

/* V0.30.7 — Galeria persistente */
.sidebar-library-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-8px 0 16px}

const COST_RATES={
  'gpt-5.6-sol':{input:5, cached:0.5, output:30, kind:'text'},
  'gpt-5.6':{input:5, cached:0.5, output:30, kind:'text'},

  'gpt-5.6-luna':{input:0.2, cached:0.02, output:1.2, kind:'text'},

};
function beginCostSession(label='Criação'){
  state.costSupervisor={sessionId:crypto.randomUUID(),startedAt:Date.now(),events:[],label,currency:'USD'};
  renderCostSupervisor();
}
function usageNum(obj,...paths){
  for(const path of paths){
    let v=obj;
    for(const k of path.split('.'))v=v?.[k];
    if(Number.isFinite(Number(v)))return Number(v);
  }
  return 0;
}
function estimateUsageCost(model,usage,toolUsage=null){
  if(!usage&&!toolUsage)return {usd:0,estimated:true,note:'usage indisponível'};
  const r=COST_RATES[model]||COST_RATES['gpt-5.6-sol'];
  if(r.kind==='text'){
    const input=usageNum(usage,'input_tokens','prompt_tokens');
    const output=usageNum(usage,'output_tokens','completion_tokens');
    const cached=usageNum(usage,'input_tokens_details.cached_tokens','prompt_tokens_details.cached_tokens');
    const uncached=Math.max(0,input-cached);
    return {usd:(uncached*r.input+cached*r.cached+output*r.output)/1e6,estimated:false,input,output,cached};
  }
  const u=toolUsage||usage||{};
  const ti=usageNum(u,'input_tokens_details.text_tokens','input_details.text_tokens','text_input_tokens');
  const ii=usageNum(u,'input_tokens_details.image_tokens','input_details.image_tokens','image_input_tokens');
  const ci=usageNum(u,'input_tokens_details.cached_tokens','input_details.cached_tokens');
  const to=usageNum(u,'output_tokens_details.text_tokens','output_details.text_tokens','text_output_tokens');
  const io=usageNum(u,'output_tokens_details.image_tokens','output_details.image_tokens','image_output_tokens');
  const input=usageNum(u,'input_tokens','prompt_tokens');
  const output=usageNum(u,'output_tokens','completion_tokens');
  if(ti||ii||to||io){
    const imageCached=Math.min(ii,ci),textCached=Math.max(0,ci-imageCached);
    const usd=((Math.max(0,ti-textCached)*r.text_input)+(textCached*r.text_cached)+(Math.max(0,ii-imageCached)*r.image_input)+(imageCached*r.image_cached)+(to*r.text_output)+(io*r.image_output))/1e6;
    return {usd,estimated:false,input,output,textInput:ti,imageInput:ii,textOutput:to,imageOutput:io,cached:ci};
  }
  // Se a API não detalhar modalidade, usamos todos os tokens de entrada como imagem e saída como imagem:
  // é deliberadamente conservador para o supervisor não subestimar gasto.
  return {usd:(input*r.image_input+output*r.image_output)/1e6,estimated:true,input,output,note:'modalidade estimada'};
}

function recordOpenAIRequest(stage,meta={}){
  if(!state.costSupervisor?.sessionId)beginCostSession('Criação');
  state.costSupervisor.requests=state.costSupervisor.requests||[];
  const item={
    id:meta.requestId||crypto.randomUUID(),
    stage,
    requestId:meta.requestId||null,
    model:meta.model||meta.modelUsed||'desconhecido',
    endpoint:meta.endpoint||null,
    status:meta.status||'ok',
    usage:meta.usage||null,
    toolUsage:meta.toolUsage||null,
    at:Date.now()
  };
  state.costSupervisor.requests.push(item);
  recordCostEvent(stage,meta);
}
function costAuditSummary(){
  const req=state.costSupervisor?.requests||[];
  return {
    requests:req.length,
    failed:req.filter(x=>x.status&&x.status!=='ok').length,
    ids:req.filter(x=>x.requestId).map(x=>x.requestId)
  };
}

function recordCostEvent(stage,meta={}){
  if(!state.costSupervisor?.sessionId)beginCostSession('Criação');
  const model=meta.model||meta.modelUsed||'desconhecido';
  const calc=estimateUsageCost(model,meta.usage||null,meta.toolUsage||null);
  state.costSupervisor.events.push({
    id:crypto.randomUUID(),stage,model,usd:calc.usd||0,estimated:!!calc.estimated,
    input:calc.input||0,output:calc.output||0,cached:calc.cached||0,note:calc.note||'',at:Date.now()
  });
  renderCostSupervisor();
}

async function fetchActualOpenAICost(startMs,endMs=Date.now()){
  try{
    const r=await fetch(`/api/openai-costs?start=${Math.floor(startMs/1000)}&end=${Math.floor(endMs/1000)}`);
    const d=await r.json();
    if(r.ok&&Number.isFinite(Number(d.cost))){
      state.costSupervisor.actualCost=Number(d.cost);
      state.costSupervisor.actualEnd=endMs;
      renderCostSupervisor();
      return Number(d.cost);
    }
  }catch{}
  return null;
}
function scheduleActualCostReconcile(){
  if(!state.user?.isAdmin||!state.costSupervisor?.startedAt)return;
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),5000);
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),20000);
}

function costTotal(){return (state.costSupervisor?.events||[]).reduce((s,e)=>s+(Number(e.usd)||0),0);}

  if(review?.deliveredDespiteInspectorFailure)return ' • fiscalização técnica inconclusiva; arte preservada';

}

function moneyUSD(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:4,maximumFractionDigits:4}).format(Number(v)||0);}
function costSupervisorHTML(){
  if(!state.user?.isAdmin)return '';

  return `<div class="cost-supervisor ${state.costSupervisor?.sessionId?'show':''}" data-cost-panel>
    <div class="cost-head"><div><strong>◉ Supervisor de custos</strong><div class="cost-sub">Estimativa da sessão atual • preços verificados em 18/08/2026</div>${Number.isFinite(Number(state.costSupervisor?.actualCost))?`<div class="cost-sub" style="color:#b9d7a8">Custo real conciliado OpenAI: <b>${moneyUSD(state.costSupervisor.actualCost)}</b>${state.costSupervisor.actualCost>total+.002?` • diferença: <b>${moneyUSD(state.costSupervisor.actualCost-total)}</b>`:''}</div>`:''}${Number.isFinite(Number(state.costSupervisor?.actualCost))?`<div class="cost-sub" style="color:#b9d7a8">Custo real conciliado OpenAI: <b>${moneyUSD(state.costSupervisor.actualCost)}</b></div>`:''}</div><div class="cost-total">${moneyUSD(total)}</div></div>
    <div class="cost-sub" style="margin-top:5px">Chamadas rastreadas: ${(state.costSupervisor?.requests||[]).length}</div><div class="cost-events">${ev.length?ev.map(e=>`<div class="cost-row"><div><strong>${esc(e.stage)} <span class="cost-badge">${esc(e.model)}</span></strong><small>${e.input?`${e.input.toLocaleString()} in • `:''}${e.output?`${e.output.toLocaleString()} out • `:''}${e.estimated?'estimado':'usage da API'}</small></div><b>${moneyUSD(e.usd)}</b></div>`).join(''):'<div class="cost-sub">Os custos aparecerão aqui conforme cada etapa terminar.</div>'}</div>
  </div>`;
}
function renderCostSupervisor(){
  document.querySelectorAll('[data-cost-panel]').forEach(old=>{
    const wrap=document.createElement('div');wrap.innerHTML=costSupervisorHTML();
    const fresh=wrap.firstElementChild;if(fresh)old.replaceWith(fresh);
  });
}

function layerRow(l,z){return `<div class="layer ${state.lastMarked===l.id?'layer-new':''}"><canvas class="crop-thumb" data-crop="${l.id}" width="128" height="88"></canvas><i class="layer-dot" style="--dot:${l.color}"></i><div class="layer-info"><strong>${esc(l.name)}</strong><small>Camada ${z} • ${esc(l.typeLabel)}</small></div><span class="saved-badge">✓ Salvo</span><button class="mini-btn" onclick="removeLayer('${l.id}')">Remover</button></div>`}
function enableDraw(){
  const canvas=document.querySelector('#canvas');
  const overlay=document.querySelector('#interactionLayer');
  const img=canvas ? canvas.querySelector('img') : null;
  const cancelBtn=document.querySelector('#cancelDrawBtn');
  if(!canvas||!overlay)return;

  if(img){
    img.draggable=false;
    img.style.pointerEvents='none';
    img.style.userSelect='none';
    img.style.webkitUserDrag='none';
    img.ondragstart=()=>false;
  }

  let drawing=false;
  let origin=null;
  let draft=null;

  const point=e=>{
    const r=canvas.getBoundingClientRect();
    return {
      x:Math.max(0,Math.min(r.width,e.clientX-r.left)),
      y:Math.max(0,Math.min(r.height,e.clientY-r.top)),
      r
    };
  };

  const updateDraft=p=>{
    if(!drawing||!origin||!draft)return;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);
    Object.assign(draft.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
  };

  const cleanup=()=>{
    if(draft){draft.remove();draft=null;}
    drawing=false;
    origin=null;
    overlay.classList.remove('is-drawing');
    canvas.classList.remove('drawing-now');
    if(cancelBtn)cancelBtn.disabled=true;
  };

  const cancelSelection=()=>{
    if(!drawing)return;
    cleanup();
    showMapNotice('Seleção cancelada','Nenhuma camada foi criada. Você pode tentar novamente.','neutral');
  };

  const finish=e=>{
    if(!drawing)return;
    e.preventDefault();
    e.stopPropagation();
    const p=point(e);
    const r=origin.r;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);

    if(width<18||height<18){
      cleanup();
      showMapNotice('Seleção pequena demais','Clique e arraste envolvendo o elemento que deseja marcar.','neutral');
      return;
    }

    const select=document.querySelector('#layerType');
    const type=select?select.value:'other';
    const typeInfo=layerTypes.find(x=>x[0]===type)||layerTypes[layerTypes.length-1];
    const layer={
      id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
      type,
      typeLabel:typeInfo[1],
      name:guessName(type),
      color:colors[state.layers.length%colors.length],
      x:left/r.width*100,
      y:top/r.height*100,
      w:width/r.width*100,
      h:height/r.height*100,
      description:'',
      replacement:''
    };

    state.layers.push(layer);
    state.lastMarked=layer.id;
    const currentIndex=layerTypes.findIndex(x=>x[0]===type);
    state.nextLayerType=layerTypes[(currentIndex+1)%layerTypes.length][0];
    cleanup();
    screenMap();
  };

  overlay.addEventListener('mousedown',e=>{
    if(e.button!==0||drawing)return;
    e.preventDefault();
    e.stopPropagation();
    const p=point(e);
    origin={x:p.x,y:p.y,r:p.r};
    drawing=true;

    draft=document.createElement('div');
    draft.className='annotation drawing';
    draft.style.setProperty('--boxColor',colors[state.layers.length%colors.length]);
    Object.assign(draft.style,{left:p.x+'px',top:p.y+'px',width:'0px',height:'0px'});
    draft.innerHTML='<span>Selecionando…</span>';
    canvas.appendChild(draft);
    overlay.classList.add('is-drawing');
    canvas.classList.add('drawing-now');
    if(cancelBtn)cancelBtn.disabled=false;
  });

  overlay.addEventListener('mousemove',e=>{
    if(!drawing)return;
    e.preventDefault();
    updateDraft(point(e));
  });

  overlay.addEventListener('mouseup',finish);
  overlay.addEventListener('mouseleave',e=>{
    if(drawing) updateDraft(point(e));
  });

  window.addEventListener('mouseup',e=>{
    if(drawing) finish(e);
  });

  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&drawing){
      e.preventDefault();
      cancelSelection();
    }
  });


  const touchPoint=e=>{
    const t=e.touches?.[0]||e.changedTouches?.[0];if(!t)return null;
    return point({clientX:t.clientX,clientY:t.clientY});
  };
  overlay.addEventListener('touchstart',e=>{
    if(drawing)return;e.preventDefault();const p=touchPoint(e);if(!p)return;
    origin={x:p.x,y:p.y,r:p.r};drawing=true;
    draft=document.createElement('div');draft.className='annotation drawing';draft.style.setProperty('--boxColor',colors[state.layers.length%colors.length]);
    Object.assign(draft.style,{left:p.x+'px',top:p.y+'px',width:'0px',height:'0px'});draft.innerHTML='<span>Selecionando…</span>';
    canvas.appendChild(draft);overlay.classList.add('is-drawing');canvas.classList.add('drawing-now');if(cancelBtn)cancelBtn.disabled=false;
  },{passive:false});
  overlay.addEventListener('touchmove',e=>{if(!drawing)return;e.preventDefault();const p=touchPoint(e);if(p)updateDraft(p);},{passive:false});
  overlay.addEventListener('touchend',e=>{if(!drawing)return;e.preventDefault();const t=e.changedTouches?.[0];if(t)finish({preventDefault(){},stopPropagation(){},clientX:t.clientX,clientY:t.clientY});},{passive:false});

  if(cancelBtn)cancelBtn.onclick=cancelSelection;
}

const LOGO_CRITICAL_TYPES=new Set(["person","face","hand","microphone","instrument","text_title","text_subtitle","text_date","text_address","text_other","graphic_focus"]);

    version:1,width:Number(target.width)||1080,height:Number(target.height)||1350,
    regions,toneGrid:{cols,rows,values:Array.from({length:cols*rows},(_,i)=>nclamp((input[i]??50)/100,0,1))},
    degraded:!!raw.degraded,degradations:[...(raw.degradations||[])],

function rectArea(r){return Math.max(0,r.x1-r.x0)*Math.max(0,r.y1-r.y0)}

function preferredLogoZone(slot,position){

    'bottom-left':{x0:.035,y0:.73,x1:.38,y1:.965},'bottom-center':{x0:.31,y0:.73,x1:.69,y1:.965},'bottom-right':{x0:.62,y0:.73,x1:.965,y1:.965},

function sameSideLogoZone(slot,position){

  if(p.startsWith('bottom'))return{x0:.035,y0:.51,x1:.965,y1:.965};

}
function requestedLogoAnchor(slot,position,zone,wNorm,hNorm){
  const p=normalizeLogoRegion(position,slot==='CHURCH'?'church':'event');
  if(!p)return{x:(zone.x0+zone.x1-wNorm)/2,y:(zone.y0+zone.y1-hNorm)/2};
  const left=p.includes('left'),right=p.includes('right'),top=p.startsWith('top')||p.endsWith('top'),bottom=p.startsWith('bottom')||p.endsWith('bottom');

    x:left?zone.x0:right?zone.x1-wNorm:(zone.x0+zone.x1-wNorm)/2,

function expandZone(z,amount){

function averageToneInRect(occ,rect){
  const g=occ.toneGrid||{},cols=g.cols||8,rows=g.rows||10,vals=g.values||[];
  let sum=0,n=0;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){

function chooseVariantFromTone(pref,tone){

function logoCandidateRects(zone,wNorm,hNorm,step=.02,anchor=null){
  const out=[],minX=zone.x0,maxX=zone.x1-wNorm,minY=zone.y0,maxY=zone.y1-hNorm;

  for(let y=minY;y<=maxY+.0001;y+=step)for(let x=minX;x<=maxX+.0001;x+=step){

function solveLogoSlot(occ,pref,occupied=[]){

  const W=occ.width||1080,H=occ.height||1350,ar=Math.max(.08,Number(pref.aspectRatio)||1);

function solveLogoPlan(occupancy,preferences={}){

  if(occ.semanticUnavailable||occ.degraded){

      const pref=preferences[slot];
      placements.push({slot,assetId:pref?.assetId||null,omitted:true,reason:'occupancy-unavailable',requestedPosition:pref?.position||null});
      if(pref?.visible!==false)degradations.push(`${slot}:occupancy-unavailable`);
    }

  }
  for(const slot of ['CHURCH','EVENT']){
    const p=solveLogoSlot(occ,preferences[slot],occupied);
    placements.push(p);
    if(!p.omitted)occupied.push(inflateRect(p.rect,.018));

async function localLogoLuminance(asset){

}
async function logoPreferenceFor(slot,asset,payload,target){

  let aspectRatio=1;

  const isChurch=slot==='CHURCH';
  const widthNorm=isChurch?churchLogoSizeFraction(payload.churchLogoSizePct||.16):eventLogoSizeFraction(payload.eventLogoSize||payload.eventLogoSizePct||'small');

async function renderLogoPlan(baseDataUrl,plan,preferences){
  const base=await loadImage(baseDataUrl),cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  cv.width=base.width;cv.height=base.height;ctx.drawImage(base,0,0);
  const receipt=[],degradations=[...(plan.degradations||[])];
  for(const placement of plan.placements||[]){
    if(placement.omitted){receipt.push({slot:placement.slot,omitted:true,reason:placement.reason||'omitted'});continue}
    const pref=preferences[placement.slot],variant=assetForPlannedPlacement(pref,placement);
    if(!variant?.source){receipt.push({slot:placement.slot,omitted:true,reason:'asset-unresolved'});degradations.push(`${placement.slot}:asset-unresolved`);continue}
    try{
      const img=await loadImageSafe(variant.source),r=placement.rect;
      const x=Math.round(r.x0*cv.width),y=Math.round(r.y0*cv.height),w=Math.max(1,Math.round((r.x1-r.x0)*cv.width));

}

async function persistGalleryArtwork(artwork,extra={}){
  if(!artwork)return null;
  const galleryId=artwork.galleryId||artwork.id||crypto.randomUUID();
  if(state.gallerySavedIds.includes(galleryId)&&!extra.force)return null;
  const format=extra.format||artwork.format||artwork.target?.id||state.quick.format||state.format||'feed';
  const recipe=makeGenerationRecipe(artwork,{...extra,format});
  let finalUrl=null,baseUrl=null;

  try{
    finalUrl=await uploadGalleryImage(artwork.dataUrl||artwork.url,artwork.label||'Arte',format);
    if(!finalUrl)throw new Error('A imagem final não pôde ser enviada ao Storage.');
  }catch(e){
    console.error('Galeria: falha no upload da imagem final',e);
    // A imagem continua recuperável localmente nesta máquina/sessão.
    const localItem={galleryId,label:artwork.label||'Arte',url:artwork.dataUrl||artwork.url||null,baseUrl:artwork.baseDataUrl||artwork.baseUrl||null,kind:recipe.kind,format,target:artwork.target||recipe.target||null,parentArtworkId:recipe.parentArtworkId||null,sourceArtworkId:recipe.sourceArtworkId||null,recipe,createdAt:new Date().toISOString(),saveError:e.message||'upload-final-failed'};
    galleryRecoveryUpsert(localItem);
    state.library.generations=mergeGalleryGenerations(state.library.generations||[]);
    return {...localItem,persisted:false,error:e.message||'Falha ao enviar arte final'};
  }

  // BASE PLATE é valiosa, mas não pode impedir a arte final de entrar na Galeria.
  const baseCandidate=artwork.baseDataUrl||artwork.baseUrl||null;
  if(baseCandidate){
    try{baseUrl=await uploadGalleryImage(baseCandidate,`${artwork.label||'Arte'} — base logo-free`,format)}
    catch(e){console.warn('Galeria: base logo-free não foi salva; mantendo arte final.',e)}
  }

  const item={galleryId,label:artwork.label||'Arte',url:finalUrl,baseUrl:baseUrl||null,kind:recipe.kind,format,target:artwork.target||recipe.target||null,parentArtworkId:recipe.parentArtworkId||null,sourceArtworkId:recipe.sourceArtworkId||null,recipe,createdAt:new Date().toISOString()};

  // Antes da resposta do servidor, guarde uma cópia de recuperação local.
  galleryRecoveryUpsert(item);

  let lastError=null;
  for(let attempt=0;attempt<2;attempt++){
    try{
      const d=await apiJSON('save-generation',{method:'POST',body:{format,images:[item]}});
      if(!d.generation)throw new Error('O backend não confirmou o registro da geração.');
      state.library.generations=[d.generation,...(state.library.generations||[]).filter(g=>g.id!=='local-recovery')];
      state.gallerySavedIds.push(galleryId);
      galleryRecoveryRemove(galleryId);
      return {...item,persisted:true,generationId:d.generation.id||null};
    }catch(e){
      lastError=e;
      console.warn(`Galeria: tentativa ${attempt+1}/2 falhou`,e);
      if(attempt===0)await new Promise(r=>setTimeout(r,350));
    }
  }

  // Não esconda a arte: mantém no cache local e deixa a Galeria mostrá-la.
  state.library.generations=mergeGalleryGenerations((state.library.generations||[]).filter(g=>g.id!=='local-recovery'));
  return {...item,persisted:false,error:lastError?.message||'Falha ao registrar no banco'};
}

function galleryRecoveryRead(){

}
function galleryRecoveryWrite(items){

function galleryRecoveryUpsert(item){

async function callQualityInspector(payload,signal=null){
  try{
    const r=await fetch('/api/quality-inspector',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});
    const text=await r.text();
    let data;
    try{data=JSON.parse(text)}
    catch{
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:['Fiscal retornou resposta inválida.'],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'invalid_json'}
      };
    }
    if(!r.ok){
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:[data?.error||`Fiscal indisponível (${r.status}).`],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'http_error'}
      };
    }
    assertInspectorResponse(data);
    recordOpenAIRequest('Fiscal visual',data.meta||{});
    const review=data.review;
    if(typeof review.approved!=='boolean'){
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:['Fiscal não devolveu uma decisão válida.'],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'invalid_shape'}
      };
    }
    return review;
  }catch(e){
    if(e?.name==='AbortError')throw e;
    return {
      approved:true,
      critical_error:false,
      score:0,
      technicalFailure:true,
      gross_errors:[`Fiscal indisponível: ${e.message||'falha técnica'}`],
      correction_prompt:'',
      _meta:{technicalFailure:true,reason:'exception'}
    };
  }
}
async function generateWithInvisibleReview(payload,maxCorrections=1,signal=null){

  const retryInstructions=['','Corrija apenas os erros objetivos apontados pelo fiscal. Preserve o restante da composição. Se houver risco de degradar rosto, logo ou tipografia, simplifique.'];
  for(let attempt=0;attempt<=maxCorrections;attempt++){
    const qualityCorrection=[retryInstructions[Math.min(attempt,retryInstructions.length-1)],lastReview?.correction_prompt||''].filter(Boolean).join(' ');
    const request={...payload,qualityCorrection,revisionAttempt:attempt,safeMode:attempt>=maxCorrections&&attempt>0};
    const r=await fetch('/api/generate-art',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request),signal});
    const text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error(text.slice(0,180)||`Resposta inválida (${r.status})`);}
    if(!r.ok)throw new Error(data.error||`Erro ${r.status}`);assertGeneratorResponse(data);recordOpenAIRequest(attempt===0?'Gerador de imagem':`Retry de imagem ${attempt}`,data.image.meta||{});lastImage=data.image;
    const review=await callQualityInspector({generatedImage:lastImage.url,references:payload.references||[],assets:payload.assets||{},requiredContent:payload.requiredContent||{},semanticMap:payload.semanticMap||[],userInstruction:payload.instruction||'',finalInstruction:payload.finalInstruction||'',artDirection:payload.artDirection||null,audience:payload.audience||null,designStyle:payload.designStyle||null,logoPosition:payload.logoPosition||null,eventLogoPosition:payload.eventLogoPosition||null,eventLogoSize:payload.eventLogoSize||null,omitChurchLogo:payload.omitChurchLogo||false,omitChurchName:payload.omitChurchName||false,allowedTexts:payload.allowedTexts||[],nativeCanvasRequired:true,churchImageMustBeBackground:true,typographyBlueprint:payload.artDirection?.typographyBlueprint||null},signal);
    lastReview=review;
    if(review?.technicalFailure||review?._meta?.technicalFailure)return {...lastImage,review:{...review,approved:true,deliveredDespiteInspectorFailure:true}};
    if(review.approved)return {...lastImage,review};
    const hardFailure=!!review.critical_error||(review.gross_errors||[]).some(x=>/rosto|logo|data|hor[aá]rio|endere[cç]o|duplic|borda|canvas|crop|corpo inteiro|sobrepos/i.test(String(x)));
    if(attempt<maxCorrections&&hardFailure)continue;
    return {...lastImage,review:{...review,deliveredWithoutRetry:true}};
  }
  if(lastImage)return {...lastImage,review:lastReview||{approved:true,technicalFailure:true}};

}

  const chars=[...text],widths=chars.map(ch=>ctx.measureText(ch).width);

function manualPlacementHeightNorm(asset,wNorm,canvasRatio=1){

function logoAssistantPlacementDefault(slot,asset,node){

function clampManualPlacement(p,node,asset){
  const target=node?.target||{},cw=Number(target.width)||1080,ch=Number(target.height)||1350,ratio=cw/ch;
  p.w=Math.max(.05,Math.min(.38,Number(p.w)||.14));p.h=manualPlacementHeightNorm(asset,p.w,ratio);
  p.x=Math.max(0,Math.min(1-p.w,Number(p.x)||0));p.y=Math.max(0,Math.min(1-p.h,Number(p.y)||0));return p;
}

async function composeManualLogos(baseDataUrl,placements=[]){

  if(p<=8)return 27;if(p<=18)return 44;if(p<=30)return 46;if(p<=48)return 85;if(p<=88)return 97;return Math.min(98,p+5);
}
function animateQuickProgress(){
  const wrap=document.querySelector('#quickProgress'),bar=document.querySelector('#quickProgressBar'),num=document.querySelector('#quickProgressPct');
  if(!wrap){quickProgressRaf=null;return}
  const diff=quickProgressTarget-quickProgressVisual;
  if(Math.abs(diff)>.03){
    const step=Math.max(.035,Math.abs(diff)*(quickProgressTarget>=100?.16:.018));
    quickProgressVisual+=Math.sign(diff)*Math.min(Math.abs(diff),step);
  }else quickProgressVisual=quickProgressTarget;
  const shown=Math.max(0,Math.min(100,quickProgressVisual));if(bar)bar.style.width=`${shown.toFixed(2)}%`;if(num)num.textContent=`${Math.floor(shown)}%`;
  if(quickProgressVisual!==quickProgressTarget||quickProgressTarget<100)quickProgressRaf=requestAnimationFrame(animateQuickProgress);else quickProgressRaf=null;
}

  const p=Math.max(0,Math.min(100,Number(pct)||0));if(quickProgressHideTimer){clearTimeout(quickProgressHideTimer);quickProgressHideTimer=null}
  if(p===0){quickProgressVisual=0;quickProgressTarget=0;wrap.classList.remove('show');const bar=document.querySelector('#quickProgressBar'),num=document.querySelector('#quickProgressPct');if(bar)bar.style.width='0%';if(num)num.textContent='0%';if(label)label.textContent=text||'Processando sua arte...';return}

function logoBoxForRegion(kind,region,widthPct,imgW,imgH,canvasW,canvasH){

  if(kind==='church'){
    const m={
      'top-left':[safeX,safeY],'top-center':[(canvasW-w)/2,safeY],'top-right':[canvasW-safeX-w,safeY],
      'bottom-left':[safeX,canvasH-safeY-h],'bottom-center':[(canvasW-w)/2,canvasH-safeY-h],'bottom-right':[canvasW-safeX-w,canvasH-safeY-h]

  }

}

async function resizeToTarget(dataUrl,target){
  const img=await loadImageSafe(dataUrl);
  const srcW=img.naturalWidth||img.width,srcH=img.naturalHeight||img.height;
  const targetW=Number(target.width)||srcW,targetH=Number(target.height)||srcH;
  const srcRatio=srcW/srcH,targetRatio=targetW/targetH;
  const ratioDrift=Math.abs(Math.log(srcRatio/targetRatio));

  // Com size nativo, normalmente não haverá diferença relevante.
  // Pequenas diferenças técnicas são normalizadas por cover.
  // Diferença grande NÃO causa retry nem erro: preservamos a arte paga e marcamos
  // fallback interno. Isso só deve ocorrer se a API/modelo ignorar o size solicitado.
  const c=document.createElement('canvas');
  c.width=targetW;c.height=targetH;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';

  const aspectRatioFallback=ratioDrift>0.08;
  drawImageCover(ctx,img,c.width,c.height);

  return {dataUrl:c.toDataURL('image/png'),aspectRatioFallback};
}

    parent.adaptations.push(child);let savedChild=null;/* NEWFLOW: derivada base só é persistida após Finalizar arte no Assistente de Logos. */if(!payload.manualLogoFlow){savedChild=await persistGalleryArtwork(child,{kind:'arte derivada',parentArtworkId:parent.galleryId||parent.id||null,sourceArtworkId:source.galleryId||source.id||parent.galleryId||parent.id||null,format:formatId,basedOnKey:source.key,basedOnLabel:source.label});if(savedChild)child.galleryId=savedChild.galleryId;}
    setQuickProgress(100,'Pronto');
    if(status)status.innerHTML='<strong style="color:var(--good)">✓ Arte derivada base pronta. Clique em Prosseguir para finalizar as logos.</strong>';
    const wrap=document.querySelector('#quickResultsWrap');if(wrap)wrap.innerHTML=renderQuickResultsHTML()+allArtworksHTML();
    bindQuickResultEvents();bindAllArtworksEvents();renderCostSupervisor();
  }catch(e){
    if(e.name==='AbortError'){if(status)status.textContent='Processamento cancelado.';setQuickProgress(0,'Cancelado');}
    else if(status)status.innerHTML=`<strong style="color:#ff9eac">Não foi possível adaptar.</strong><br>${esc(e.message)}`;
  }finally{activeProcessController=null;if(cancel)cancel.style.display='none';}
}
next.onclick=()=>{if(state.step===steps.length-1){state.step=0;state.reference=null;state.layers=[];state.instruction='';render();return}state.step++;render()};back.onclick=()=>{if(state.step>0){state.step--;render()}};render();bootstrapLibrary().finally(()=>setTimeout(showModeChooser,150));

</script>
