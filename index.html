/* V0.6 */

.download-btn{border-color:#315f49;color:#c6f5d9;background:#102419}

.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gallery-item{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d0f13}

/* V0.8 — mobile, referências, previews, loading */

.event-logo-guide:before{left:27%!important;right:27%!important;top:20%!important;bottom:20%!important}
.event-logo-pos{width:24px!important;height:16px!important}
.event-logo-pos[data-event-pos="left-top"]{left:29%!important;top:27%!important}
.event-logo-pos[data-event-pos="right-top"]{right:29%!important;top:27%!important}
.event-logo-pos[data-event-pos="left-middle"]{left:29%!important;top:46%!important}
.event-logo-pos[data-event-pos="right-middle"]{right:29%!important;top:46%!important}
.event-logo-pos[data-event-pos="left-bottom"]{left:29%!important;bottom:27%!important}
.event-logo-pos[data-event-pos="right-bottom"]{right:29%!important;bottom:27%!important}
.event-logo-size-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;max-width:390px}
.event-logo-size-card{border:1px solid var(--line);background:#11141a;border-radius:10px;padding:8px;cursor:pointer;min-width:0}
.event-logo-size-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#1a1318}
.event-logo-size-canvas{position:relative;width:100%;aspect-ratio:4/5;background:#1b2029;border-radius:6px;overflow:hidden;margin-bottom:6px}
.event-logo-size-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:8%;border-radius:3px;background:#f2f3f5;opacity:.92}
.event-logo-size-card[data-event-size="small"] .event-logo-size-mark{width:14%}
.event-logo-size-card[data-event-size="medium"] .event-logo-size-mark{width:20%}
.event-logo-size-card[data-event-size="large"] .event-logo-size-mark{width:26%}
.event-logo-size-card strong{font-size:9px;display:block;text-align:center}.event-logo-size-card small{font-size:7px;color:var(--muted);display:block;text-align:center;margin-top:2px}
.church-logo-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.church-logo-option{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#11141a;border-radius:9px;padding:9px;font-size:9px;cursor:pointer}
.church-logo-option input{accent-color:var(--accent)}


/* V0.28.5 — hierarquia de até 3 pregadores */
.quick-asset[data-qpastor]{position:relative}
.pastor-rank-badge{
  position:absolute;left:6px;top:6px;z-index:3;
  padding:4px 6px;border-radius:7px;background:rgba(7,9,12,.88);
  border:1px solid #596273;color:#fff;font-size:7px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;pointer-events:none
}
.quick-asset.multi-selected[data-pastor-rank="0"]{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(255,76,114,.3) inset}
.quick-asset.multi-selected[data-pastor-rank="1"],
.quick-asset.multi-selected[data-pastor-rank="2"]{border-color:#697386!important}
.pastor-order-summary{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 9px}
.pastor-order-pill{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:#11141a;color:#cfd5df}
.pastor-order-pill b{color:white}


/* NEWFLOW v0.2 — Assistente manual de logos */
.logo-assistant-overlay{position:fixed;inset:0;z-index:150000;background:rgba(4,6,10,.96);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.logo-assistant-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:#0d1015}.logo-assistant-head h2{font-size:16px;margin:0}.logo-assistant-head small{display:block;color:var(--muted);margin-top:3px}
.logo-assistant-body{min-height:0;display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:14px;padding:14px}.logo-assistant-panel{position:relative;z-index:5;pointer-events:auto;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#0f1217;padding:14px}.logo-assistant-stage-wrap{position:relative;z-index:4;pointer-events:auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#080a0d;padding:12px}
.logo-assistant-stage{position:relative;line-height:0;box-shadow:0 20px 70px rgba(0,0,0,.45);overflow:hidden;background:#111;touch-action:none}.logo-assistant-stage>img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.logo-palette-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#cfd5df;margin:4px 0 8px}.logo-palette{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.logo-palette-item{appearance:none;width:100%;color:inherit;text-align:left;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:#151922;cursor:grab;min-width:0;touch-action:none;position:relative;z-index:2}.logo-palette-item:hover{border-color:#555e70}.logo-palette-item.is-pointer-dragging{opacity:.55;cursor:grabbing}.logo-drag-ghost{position:fixed;z-index:170000;width:92px;height:70px;pointer-events:none;border:1px solid #687386;border-radius:10px;background:#151922;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.5)}.logo-drag-ghost img{width:100%;height:100%;object-fit:contain}.logo-palette-item .logo-preview-surface{height:64px}.logo-palette-item strong,.logo-palette-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logo-palette-item strong{font-size:9px;margin-top:6px}.logo-palette-item small{font-size:8px;color:var(--muted);margin-top:2px}
.manual-logo-node{position:absolute;line-height:normal;cursor:move;touch-action:none;user-select:none}.manual-logo-node img{display:block;width:100%;height:auto;pointer-events:none;filter:none}.manual-logo-node.selected{outline:2px solid #fff;outline-offset:3px}.manual-logo-node .slot-tag{position:absolute;left:0;top:-20px;background:#fff;color:#111;font-size:8px;font-weight:900;padding:3px 5px;border-radius:5px;line-height:1}
.logo-assistant-controls{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}.logo-assistant-controls label{display:block;font-size:9px;color:#cfd5df;margin-bottom:6px}.logo-assistant-controls input[type=range]{width:100%;pointer-events:auto;touch-action:pan-x;position:relative;z-index:6}.logo-assistant-actions{display:grid;gap:8px;margin-top:16px}.logo-assistant-actions .btn{width:100%}.logo-assistant-version{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);text-align:center;font-size:8px;color:var(--muted);letter-spacing:.08em}.logo-assistant-note{font-size:9px;color:var(--muted);line-height:1.5;margin:8px 0 12px}.flow-badge{display:inline-flex;align-items:center;border:1px solid #3c4655;border-radius:99px;padding:4px 8px;font-size:8px;color:#cbd2df;margin-bottom:8px}.proceed-btn{border-color:#7d6cff!important;background:#1b1830!important;color:#e7e2ff!important}
@media(max-width:850px){.logo-assistant-body{grid-template-columns:1fr;overflow:auto}.logo-assistant-stage-wrap{min-height:420px}.logo-assistant-stage{max-width:92vw}.logo-palette{grid-template-columns:repeat(3,1fr)}}


/* NEWFLOW v0.40 — authentication */
.auth-gate{position:fixed;inset:0;z-index:10000;background:#090b0f;display:grid;place-items:center;padding:20px}
.auth-gate.hidden{display:none}.auth-card{width:min(430px,96vw);background:#111318;border:1px solid #2a2e37;border-radius:20px;padding:26px;box-shadow:0 30px 100px rgba(0,0,0,.55)}

.account-signout{width:100%;margin-top:10px}.account-email{display:block;color:#969dac;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}

/* NEWFLOW v0.40 — Telão occupancy selector + Modo Livre */
.screen-occupancy-block{grid-column:1/-1;margin-top:4px;padding:12px;border:1px solid var(--field-border);background:var(--soft-surface);border-radius:12px}
.screen-occupancy-block>strong{display:block;font-size:10px;margin-bottom:4px}
.screen-occupancy-block>small{display:block;color:var(--muted);font-size:8px;line-height:1.45;margin-bottom:10px}
.screen-occupancy-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.screen-occupancy-option{border:1px solid var(--field-border);background:var(--field-bg);border-radius:10px;padding:7px;cursor:pointer;text-align:center;color:var(--text)}
.screen-occupancy-option.active{border-color:var(--brand-orange);box-shadow:0 0 0 2px rgba(255,106,0,.13)}
.screen-occupancy-preview{height:54px;border-radius:7px;background:var(--field-bg-2);position:relative;overflow:hidden;margin-bottom:5px;border:1px solid var(--field-border)}
.screen-occupancy-preview i{position:absolute;display:block;border-radius:3px;background:var(--brand-orange);opacity:.88;left:50%;transform:translateX(-50%)}
.screen-occupancy-option[data-screen-occupancy="5"] i{width:30%;height:7%;bottom:8%}
.screen-occupancy-option[data-screen-occupancy="20"] i{width:38%;height:25%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option[data-screen-occupancy="30"] i{width:48%;height:35%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option[data-screen-occupancy="40"] i{width:58%;height:45%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option[data-screen-occupancy="50"] i{width:68%;height:55%;top:50%;transform:translate(-50%,-50%)}
.screen-occupancy-option b{font-size:9px}
.free-mode-box{padding:13px;border:1px solid var(--field-border);background:var(--soft-surface);border-radius:12px}
.free-mode-formats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0}
.free-format-option{border:1px solid var(--field-border);background:var(--field-bg);color:var(--text);border-radius:9px;padding:8px 5px;font-size:8px;font-weight:800;cursor:pointer}

.free-mode-box textarea{width:100%;min-height:120px;margin-top:7px}

.feed-grid{columns:4 260px;column-gap:16px}.feed-card{break-inside:avoid;margin:0 0 16px;border:1px solid color-mix(in srgb,var(--field-border) 52%,transparent);border-radius:16px;background:color-mix(in srgb,var(--panel) 95%,var(--bg));overflow:hidden;box-shadow:0 9px 25px rgba(0,0,0,.07)}
.feed-card-head{display:flex;align-items:center;gap:10px;padding:12px 13px}.feed-card-head>div:last-child{min-width:0}.feed-card-head strong,.feed-card-head small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed-card-head strong{font-size:11.5px}.feed-card-head small{font-size:9.5px;color:var(--muted);margin-top:2px}

.feed-art-wrap{display:block;width:100%;padding:0;border:0;background:transparent;cursor:pointer}.feed-art-wrap img{display:block;width:100%;height:auto;max-height:660px;object-fit:contain;background:#090a0c}
.feed-card-actions{display:flex;gap:7px;align-items:center;padding:11px 12px;flex-wrap:wrap}.feed-like{height:34px;min-width:50px;padding:0 11px;border:1px solid var(--field-border);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:12px;font-weight:750}.feed-like.liked{color:#ff5d70;border-color:rgba(255,93,112,.34);background:rgba(255,93,112,.07)}
.feed-explore-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-flow:dense;grid-auto-rows:150px;gap:6px}.feed-explore-item{position:relative;padding:0;border:0;border-radius:7px;overflow:hidden;background:#0b0c0f;cursor:pointer;min-width:0}.feed-explore-item img{width:100%;height:100%;object-fit:cover}.feed-explore-item span{position:absolute;right:7px;bottom:6px;background:rgba(0,0,0,.58);color:#fff;border-radius:10px;padding:3px 6px;font-size:8px}.feed-explore-item.landscape{grid-column:span 2}.feed-explore-item.tall{grid-row:span 2}.feed-explore-item.square{grid-row:span 1}.feed-explore-item.portrait{grid-row:span 2}
.feed-detail-panel{width:min(940px,95vw)!important;max-height:94vh!important;overflow:auto!important}.feed-detail-author{display:flex;align-items:center;gap:12px}.feed-detail-author h2{margin:0;font-size:17px}.feed-detail-author p{margin:4px 0 0;color:var(--muted);font-size:11px}.feed-detail-main{display:grid;place-items:center;background:#090a0c;border-radius:14px;overflow:hidden}.feed-detail-main img{display:block;max-width:100%;max-height:70vh;object-fit:contain}.feed-detail-actions{display:flex;gap:10px;margin-top:14px}.feed-more-title{font-size:14px;margin:26px 0 12px}.feed-derivatives{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.feed-derivative{border:1px solid color-mix(in srgb,var(--field-border) 55%,transparent);border-radius:13px;overflow:hidden;background:var(--soft-surface)}.feed-derivative img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.feed-derivative strong{display:block;padding:9px;font-size:10px}
.feed-settings-shell{padding:6px 2px}.feed-settings-head{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:18px;border:1px solid color-mix(in srgb,var(--field-border) 52%,transparent);border-radius:16px;background:var(--soft-surface)}.feed-settings-head h3{font-size:15px;margin:0 0 7px}.feed-settings-head p{font-size:11px;line-height:1.55;color:var(--muted);margin:0;max-width:590px}.feed-settings-note{margin:12px 3px;color:var(--muted);font-size:10px;line-height:1.5}
.premium-switch{position:relative;width:54px;height:31px;flex:none}.premium-switch input{position:absolute;opacity:0}.premium-switch span{position:absolute;inset:0;border-radius:30px;background:var(--field-border);cursor:pointer;transition:.18s}.premium-switch span:after{content:'';position:absolute;width:23px;height:23px;left:4px;top:4px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:.18s}.premium-switch input:checked+span{background:var(--brand-orange)}.premium-switch input:checked+span:after{transform:translateX(23px)}

/* CHURCHDESIGN v0.52 — manual gallery publishing */
.gallery-publish-btn{border-color:color-mix(in srgb,var(--brand-orange) 46%,var(--field-border))!important;background:color-mix(in srgb,var(--brand-orange) 8%,transparent)!important;font-weight:800!important}

}

  opacity:1!important;

  border-color:#addfc8!important;
  background:#edf9f3!important;
}

}

  white-space:nowrap!important;cursor:pointer!important

.gallery-actions-clean .gallery-main-action:hover,.gallery-actions-clean .gallery-more-btn:hover{background:var(--soft-surface-2)!important}
.gallery-actions-clean .gallery-publish-btn{border-color:color-mix(in srgb,var(--brand-orange) 42%,var(--field-border))!important;background:color-mix(in srgb,var(--brand-orange) 7%,var(--field-bg))!important}

const COST_RATES={
  'gpt-5.6-sol':{input:5, cached:0.5, output:30, kind:'text'},
  'gpt-5.6':{input:5, cached:0.5, output:30, kind:'text'},
  'gpt-5.6-terra':{input:2, cached:0.2, output:12, kind:'text'},
  'gpt-5.6-luna':{input:0.2, cached:0.02, output:1.2, kind:'text'},
  'gpt-image-2':{text_input:5,text_cached:1.25,text_output:10,image_input:8,image_cached:2,image_output:30,kind:'image'}
};
function beginCostSession(label='Criação'){
  state.costSupervisor={sessionId:crypto.randomUUID(),startedAt:Date.now(),events:[],label,currency:'USD'};
  renderCostSupervisor();
}
function usageNum(obj,...paths){
  for(const path of paths){
    let v=obj;
    for(const k of path.split('.'))v=v?.[k];
    if(Number.isFinite(Number(v)))return Number(v);
  }
  return 0;
}
function estimateUsageCost(model,usage,toolUsage=null){
  if(!usage&&!toolUsage)return {usd:0,estimated:true,note:'usage indisponível'};
  const r=COST_RATES[model]||COST_RATES['gpt-5.6-sol'];
  if(r.kind==='text'){
    const input=usageNum(usage,'input_tokens','prompt_tokens');
    const output=usageNum(usage,'output_tokens','completion_tokens');
    const cached=usageNum(usage,'input_tokens_details.cached_tokens','prompt_tokens_details.cached_tokens');
    const uncached=Math.max(0,input-cached);
    return {usd:(uncached*r.input+cached*r.cached+output*r.output)/1e6,estimated:false,input,output,cached};
  }
  const u=toolUsage||usage||{};
  const ti=usageNum(u,'input_tokens_details.text_tokens','input_details.text_tokens','text_input_tokens');
  const ii=usageNum(u,'input_tokens_details.image_tokens','input_details.image_tokens','image_input_tokens');
  const ci=usageNum(u,'input_tokens_details.cached_tokens','input_details.cached_tokens');
  const to=usageNum(u,'output_tokens_details.text_tokens','output_details.text_tokens','text_output_tokens');
  const io=usageNum(u,'output_tokens_details.image_tokens','output_details.image_tokens','image_output_tokens');
  const input=usageNum(u,'input_tokens','prompt_tokens');
  const output=usageNum(u,'output_tokens','completion_tokens');
  if(ti||ii||to||io){
    const imageCached=Math.min(ii,ci),textCached=Math.max(0,ci-imageCached);
    const usd=((Math.max(0,ti-textCached)*r.text_input)+(textCached*r.text_cached)+(Math.max(0,ii-imageCached)*r.image_input)+(imageCached*r.image_cached)+(to*r.text_output)+(io*r.image_output))/1e6;
    return {usd,estimated:false,input,output,textInput:ti,imageInput:ii,textOutput:to,imageOutput:io,cached:ci};
  }
  // Se a API não detalhar modalidade, usamos todos os tokens de entrada como imagem e saída como imagem:
  // é deliberadamente conservador para o supervisor não subestimar gasto.
  return {usd:(input*r.image_input+output*r.image_output)/1e6,estimated:true,input,output,note:'modalidade estimada'};
}

function recordOpenAIRequest(stage,meta={}){
  if(!state.costSupervisor?.sessionId)beginCostSession('Criação');
  state.costSupervisor.requests=state.costSupervisor.requests||[];
  const item={
    id:meta.requestId||crypto.randomUUID(),
    stage,
    requestId:meta.requestId||null,
    model:meta.model||meta.modelUsed||'desconhecido',
    endpoint:meta.endpoint||null,
    status:meta.status||'ok',
    usage:meta.usage||null,
    toolUsage:meta.toolUsage||null,
    at:Date.now()
  };
  state.costSupervisor.requests.push(item);
  recordCostEvent(stage,meta);
}
function costAuditSummary(){
  const req=state.costSupervisor?.requests||[];
  return {
    requests:req.length,
    failed:req.filter(x=>x.status&&x.status!=='ok').length,
    ids:req.filter(x=>x.requestId).map(x=>x.requestId)
  };
}

function recordCostEvent(stage,meta={}){
  if(!state.costSupervisor?.sessionId)beginCostSession('Criação');
  const model=meta.model||meta.modelUsed||'desconhecido';
  const calc=estimateUsageCost(model,meta.usage||null,meta.toolUsage||null);
  state.costSupervisor.events.push({
    id:crypto.randomUUID(),stage,model,usd:calc.usd||0,estimated:!!calc.estimated,
    input:calc.input||0,output:calc.output||0,cached:calc.cached||0,note:calc.note||'',at:Date.now()
  });
  renderCostSupervisor();
}

async function fetchActualOpenAICost(startMs,endMs=Date.now()){
  try{
    const r=await authFetch(`/api/openai-costs?start=${Math.floor(startMs/1000)}&end=${Math.floor(endMs/1000)}`);
    const d=await r.json();
    if(r.ok&&Number.isFinite(Number(d.cost))){
      state.costSupervisor.actualCost=Number(d.cost);
      state.costSupervisor.actualEnd=endMs;
      renderCostSupervisor();
      return Number(d.cost);
    }
  }catch{}
  return null;
}
function scheduleActualCostReconcile(){
  if(!state.user?.isAdmin||!state.costSupervisor?.startedAt)return;
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),5000);
  setTimeout(()=>fetchActualOpenAICost(state.costSupervisor.startedAt-3000,Date.now()+1000),20000);
}

function costTotal(){return (state.costSupervisor?.events||[]).reduce((s,e)=>s+(Number(e.usd)||0),0);}

function inspectorDeliveryNote(review){
  if(review?.deliveredDespiteInspectorFailure)return ' • fiscalização técnica inconclusiva; arte preservada';
  if(review?.deliveredAfterFinalReview)return ' • entregue após última tentativa';
  return '';
}

function moneyUSD(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:4,maximumFractionDigits:4}).format(Number(v)||0);}
function costSupervisorHTML(){
  if(!state.user?.isAdmin)return '';

function enableDraw(){
  const canvas=document.querySelector('#canvas');
  const overlay=document.querySelector('#interactionLayer');
  const img=canvas ? canvas.querySelector('img') : null;
  const cancelBtn=document.querySelector('#cancelDrawBtn');
  if(!canvas||!overlay)return;

  if(img){
    img.draggable=false;
    img.style.pointerEvents='none';
    img.style.userSelect='none';
    img.style.webkitUserDrag='none';
    img.ondragstart=()=>false;
  }

  let drawing=false;
  let origin=null;
  let draft=null;

  const point=e=>{
    const r=canvas.getBoundingClientRect();
    return {
      x:Math.max(0,Math.min(r.width,e.clientX-r.left)),
      y:Math.max(0,Math.min(r.height,e.clientY-r.top)),
      r
    };
  };

  const updateDraft=p=>{
    if(!drawing||!origin||!draft)return;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);
    Object.assign(draft.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
  };

  const cleanup=()=>{
    if(draft){draft.remove();draft=null;}
    drawing=false;
    origin=null;
    overlay.classList.remove('is-drawing');
    canvas.classList.remove('drawing-now');
    if(cancelBtn)cancelBtn.disabled=true;
  };

  const cancelSelection=()=>{
    if(!drawing)return;
    cleanup();
    showMapNotice('Seleção cancelada','Nenhuma camada foi criada. Você pode tentar novamente.','neutral');
  };

  const finish=e=>{
    if(!drawing)return;
    e.preventDefault();
    e.stopPropagation();
    const p=point(e);
    const r=origin.r;
    const left=Math.min(origin.x,p.x);
    const top=Math.min(origin.y,p.y);
    const width=Math.abs(p.x-origin.x);
    const height=Math.abs(p.y-origin.y);

    if(width<18||height<18){
      cleanup();
      showMapNotice('Seleção pequena demais','Clique e arraste envolvendo o elemento que deseja marcar.','neutral');
      return;
    }

    const select=document.querySelector('#layerType');
    const type=select?select.value:'other';
    const typeInfo=layerTypes.find(x=>x[0]===type)||layerTypes[layerTypes.length-1];
    const layer={
      id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
      type,
      typeLabel:typeInfo[1],
      name:guessName(type),
      color:colors[state.layers.length%colors.length],
      x:left/r.width*100,
      y:top/r.height*100,
      w:width/r.width*100,
      h:height/r.height*100,
      description:'',
      replacement:''
    };

    state.layers.push(layer);
    state.lastMarked=layer.id;
    const currentIndex=layerTypes.findIndex(x=>x[0]===type);
    state.nextLayerType=layerTypes[(currentIndex+1)%layerTypes.length][0];
    cleanup();
    screenMap();

function fileToUrl(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}

async function optimizeImageFile(file,maxDim=1600,quality=.88,preserveAlpha=false){
  if(!file)return null;
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
  if(file.type==='image/png'&&file.size<900000)return raw;
  const img=await loadImage(raw);
  const scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  return preserveAlpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',quality);
}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();if(src&&!String(src).startsWith('data:')&&!String(src).startsWith('blob:'))img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});}

}
function computePreferenceProfile(){
  const ratings=state.library.ratings||[];if(!ratings.length)return null;
  const buckets={design_style:{},inspiration_style:{},effect:{},audience:{}};
  ratings.forEach((r,i)=>{const weight=(Number(r.rating)||3)-3;const recency=1+Math.max(0,(ratings.length-i)/Math.max(1,ratings.length))*.15;for(const k of Object.keys(buckets)){const v=r[k];if(v)buckets[k][v]=(buckets[k][v]||0)+weight*recency;}});
  const top=k=>Object.entries(buckets[k]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
  return {designStyle:top('design_style'),inspirationStyle:top('inspiration_style'),effect:top('effect'),audience:top('audience')};
}

async function downloadDataUrl(dataUrl,filename,meta={}){
  try{
    let blob=null;
    if(String(dataUrl).startsWith('data:')){
      const comma=dataUrl.indexOf(','),head=dataUrl.slice(0,comma),raw=dataUrl.slice(comma+1),mime=(head.match(/^data:([^;,]+)/)||[])[1]||'image/png';
      if(/;base64/i.test(head)){const bin=atob(raw),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);blob=new Blob([bytes],{type:mime});}
      else blob=new Blob([decodeURIComponent(raw)],{type:mime});
    }else{
      try{const r=await fetch(dataUrl,{cache:'no-store'});if(r.ok)blob=await r.blob();}catch(_){ }
      if(!blob){const local=await remoteToDataUrl(dataUrl);return downloadDataUrl(local,filename,meta);}
    }
    if(!blob||!blob.size)throw new Error('Arquivo de imagem vazio.');
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename||'churchdesign.png';a.rel='noopener';a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);if(!meta?.silentRating)setTimeout(()=>showRatingPopup(meta),450);return true;
  }catch(e){console.error('downloadDataUrl',e);showMapNotice('Não foi possível baixar','Tente novamente. A imagem continua salva nesta tela.');return false;}
}

function logoVariantMeta(a){return a?.meta||a?.metadata||a?.data||{}}
function logoVariantGroup(a){const m=logoVariantMeta(a);return m.logoGroupId||m.variantGroupId||m.variantOf||a?.id||null}
function logoVariantRole(a){const m=logoVariantMeta(a);return m.logoVariantRole||m.variantRole||(m.variantOf?'contrast':'primary')}
function findLogoContrastVariant(a){
  if(!a)return null;
  const assets=state.library.assets||[],m=logoVariantMeta(a),g=logoVariantGroup(a),primaryId=m.variantOf||a.id;
  return assets.find(x=>{
    if(!x||x.id===a.id||logoVariantRole(x)!=='contrast')return false;
    const xm=logoVariantMeta(x);
    return String(xm.variantOf||'')===String(primaryId)||String(logoVariantGroup(x)||'')===String(g||'');
  })||null;
}
async function uploadLogoContrastVariant(primary,kind='church',file=null){
  if(!primary)return null;
  const gid=logoVariantGroup(primary)||primary.id||crypto.randomUUID();
  if(!file){
    file=await new Promise(resolve=>{
      const input=document.createElement('input');input.type='file';input.accept='image/*';
      input.onchange=()=>resolve(input.files?.[0]||null);input.click();
    });
  }
  if(!file)return null;
  const cropped=await cropImageBeforeUpload(file,kind==='event'?'event_logo':'logo');
  if(!cropped)return null;
  const variant=await uploadLibraryAsset(cropped,kind==='event'?'event_logo':'logo',{
    logoGroupId:gid,logoVariantRole:'contrast',variantOf:primary.id||null
  });
  if(!variant)return null;
  const updated=await updateLibraryAssetMeta(primary.id,{logoGroupId:gid,logoVariantRole:'primary'});
  if(updated)primary=updated;
  return variant;
}
function reconcileLogoVariantLinks(asset){
  if(!asset)return null;const found=findLogoContrastVariant(asset);if(found)return found;
  const assets=state.library.assets||[],direct=assets.find(x=>String(logoVariantMeta(x).variantOf||'')===String(asset.id)&&logoVariantRole(x)==='contrast');
  return direct||null;

async function ensureLogoContrastVariant(asset,kind='church'){

  return await new Promise(resolve=>{

    ov.style.cssText='position:fixed;inset:0;background:#000b;z-index:99999;display:grid;place-items:center;padding:18px';

    document.body.appendChild(ov);
    const close=v=>{ov.remove();resolve(v)};
    ov.querySelector('[data-risk]').onclick=()=>{asset.__riskSingleVariant=true;close(true)};

  });
}

async function imageAverageLuminance(src){
  const safe=await remoteToDataUrl(src),im=await loadImage(safe),cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});
  cv.width=cv.height=48;x.drawImage(im,0,0,48,48);
  let d;try{d=x.getImageData(0,0,48,48).data}catch(e){throw new Error('Não foi possível analisar o contraste da logo com segurança. A imagem remota não foi convertida para uma cópia local.')}

}

    version:1,width:Number(target.width)||1080,height:Number(target.height)||1350,
    regions,toneGrid:{cols,rows,values:Array.from({length:cols*rows},(_,i)=>nclamp((input[i]??50)/100,0,1))},
    degraded:!!raw.degraded,degradations:[...(raw.degradations||[])],

function rectArea(r){return Math.max(0,r.x1-r.x0)*Math.max(0,r.y1-r.y0)}

function inflateRect(r,p=.01){

function preferredLogoZone(slot,position){

    'bottom-left':{x0:.035,y0:.73,x1:.38,y1:.965},'bottom-center':{x0:.31,y0:.73,x1:.69,y1:.965},'bottom-right':{x0:.62,y0:.73,x1:.965,y1:.965},
    'left-top':{x0:.10,y0:.18,x1:.49,y1:.43},'left-middle':{x0:.10,y0:.34,x1:.49,y1:.66},'left-bottom':{x0:.10,y0:.57,x1:.49,y1:.82},
    'right-top':{x0:.51,y0:.18,x1:.90,y1:.43},'right-middle':{x0:.51,y0:.34,x1:.90,y1:.66},'right-bottom':{x0:.51,y0:.57,x1:.90,y1:.82}

function sameSideLogoZone(slot,position){

  if(p.startsWith('bottom'))return{x0:.035,y0:.51,x1:.965,y1:.965};

}
function requestedLogoAnchor(slot,position,zone,wNorm,hNorm){
  const p=normalizeLogoRegion(position,slot==='CHURCH'?'church':'event');
  if(!p)return{x:(zone.x0+zone.x1-wNorm)/2,y:(zone.y0+zone.y1-hNorm)/2};
  const left=p.includes('left'),right=p.includes('right'),top=p.startsWith('top')||p.endsWith('top'),bottom=p.startsWith('bottom')||p.endsWith('bottom');

    x:left?zone.x0:right?zone.x1-wNorm:(zone.x0+zone.x1-wNorm)/2,

function expandZone(z,amount){

}
function averageToneInRect(occ,rect){
  const g=occ.toneGrid||{},cols=g.cols||8,rows=g.rows||10,vals=g.values||[];
  let sum=0,n=0;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const cell={x0:col/cols,y0:row/rows,x1:(col+1)/cols,y1:(row+1)/rows};
    if(rectIntersection(rect,cell)>0){sum+=nclamp(vals[row*cols+col]??.5);n++}

function chooseVariantFromTone(pref,tone){
  const variants=(pref.variants||[]).filter(v=>v&&v.assetId);
  if(!variants.length)return null;
  if(variants.length===1)return variants[0];
  let best=variants[0],bestContrast=-1;
  for(const v of variants){
    const lum=Number.isFinite(v.luminance)?v.luminance:.5;

function logoCandidateRects(zone,wNorm,hNorm,step=.02,anchor=null){
  const out=[],minX=zone.x0,maxX=zone.x1-wNorm,minY=zone.y0,maxY=zone.y1-hNorm;

  const a=anchor||{x:(zone.x0+zone.x1-wNorm)/2,y:(zone.y0+zone.y1-hNorm)/2};
  for(let y=minY;y<=maxY+.0001;y+=step)for(let x=minX;x<=maxX+.0001;x+=step){

function solveLogoSlot(occ,pref,occupied=[]){

  const W=occ.width||1080,H=occ.height||1350,ar=Math.max(.08,Number(pref.aspectRatio)||1);
  let wNorm=nclamp(pref.widthNorm,.06,.26),hNorm=wNorm*(W/H)/ar;

    {zone:expandZone(preferred,.035),zoneHonored:false,level:1,label:'nearby'},
    {zone:sameSideLogoZone(pref.slot,pref.position),zoneHonored:false,level:2,label:'same-side'}

      variantRole:best.variant?.role||'primary',rect:best.rect,zoneHonored:best.zoneHonored,
      requestedPosition:pref.position||null,positionMode:explicit?'explicit':'auto',searchLevel:best.searchLevel,searchLabel:best.searchLabel,score:best.score,omitted:false

function solveLogoPlan(occupancy,preferences={}){

  if(occ.semanticUnavailable||occ.degraded){

      const pref=preferences[slot];
      placements.push({slot,assetId:pref?.assetId||null,omitted:true,reason:'occupancy-unavailable',requestedPosition:pref?.position||null});
      if(pref?.visible!==false)degradations.push(`${slot}:occupancy-unavailable`);
    }

  }
  for(const slot of ['CHURCH','EVENT']){
    const p=solveLogoSlot(occ,preferences[slot],occupied);
    placements.push(p);
    if(!p.omitted)occupied.push(inflateRect(p.rect,.018));

async function localLogoLuminance(asset){

}
async function logoPreferenceFor(slot,asset,payload,target){

  const isChurch=slot==='CHURCH';
  const widthNorm=isChurch?churchLogoSizeFraction(payload.churchLogoSizePct||.16):eventLogoSizeFraction(payload.eventLogoSize||payload.eventLogoSizePct||'small');

async function renderLogoPlan(baseDataUrl,plan,preferences){
  const base=await loadImage(baseDataUrl),cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  cv.width=base.width;cv.height=base.height;ctx.drawImage(base,0,0);
  const receipt=[],degradations=[...(plan.degradations||[])];
  for(const placement of plan.placements||[]){
    if(placement.omitted){receipt.push({slot:placement.slot,omitted:true,reason:placement.reason||'omitted'});continue}
    const pref=preferences[placement.slot],variant=assetForPlannedPlacement(pref,placement);
    if(!variant?.source){receipt.push({slot:placement.slot,omitted:true,reason:'asset-unresolved'});degradations.push(`${placement.slot}:asset-unresolved`);continue}
    try{
      const img=await loadImageSafe(variant.source),r=placement.rect;
      const x=Math.round(r.x0*cv.width),y=Math.round(r.y0*cv.height),w=Math.max(1,Math.round((r.x1-r.x0)*cv.width));

}

async function uploadGalleryImage(dataUrl,label,format){

async function persistGalleryArtwork(artwork,extra={}){
  if(!artwork)return null;
  const galleryId=artwork.galleryId||artwork.id||crypto.randomUUID();
  if(state.gallerySavedIds.includes(galleryId)&&!extra.force)return null;
  const format=extra.format||artwork.format||artwork.target?.id||state.quick.format||state.format||'feed';
  const recipe=makeGenerationRecipe(artwork,{...extra,format});
  let finalUrl=null,baseUrl=null;

  try{
    finalUrl=await uploadGalleryImage(artwork.dataUrl||artwork.url,artwork.label||'Arte',format);
    if(!finalUrl)throw new Error('A imagem final não pôde ser enviada ao Storage.');
  }catch(e){
    console.error('Galeria: falha no upload da imagem final',e);
    // A imagem continua recuperável localmente nesta máquina/sessão.
    const localItem={galleryId,label:artwork.label||'Arte',url:artwork.dataUrl||artwork.url||null,baseUrl:artwork.baseDataUrl||artwork.baseUrl||null,kind:recipe.kind,format,target:artwork.target||recipe.target||null,parentArtworkId:recipe.parentArtworkId||null,sourceArtworkId:recipe.sourceArtworkId||null,recipe,createdAt:new Date().toISOString(),saveError:e.message||'upload-final-failed'};
    galleryRecoveryUpsert(localItem);
    state.library.generations=mergeGalleryGenerations(state.library.generations||[]);
    return {...localItem,persisted:false,error:e.message||'Falha ao enviar arte final'};
  }

  // BASE PLATE é valiosa, mas não pode impedir a arte final de entrar na Galeria.
  const baseCandidate=artwork.baseDataUrl||artwork.baseUrl||null;
  if(baseCandidate){
    try{baseUrl=await uploadGalleryImage(baseCandidate,`${artwork.label||'Arte'} — base logo-free`,format)}
    catch(e){console.warn('Galeria: base logo-free não foi salva; mantendo arte final.',e)}
  }

  const item={galleryId,label:artwork.label||'Arte',url:finalUrl,baseUrl:baseUrl||null,kind:recipe.kind,format,target:artwork.target||recipe.target||null,parentArtworkId:recipe.parentArtworkId||null,sourceArtworkId:recipe.sourceArtworkId||null,recipe,createdAt:new Date().toISOString()};

  // Antes da resposta do servidor, guarde uma cópia de recuperação local.
  galleryRecoveryUpsert(item);

  let lastError=null;
  for(let attempt=0;attempt<2;attempt++){
    try{
      const d=await apiJSON('save-generation',{method:'POST',body:{format,images:[item]}});
      if(!d.generation)throw new Error('O backend não confirmou o registro da geração.');
      state.library.generations=[d.generation,...(state.library.generations||[]).filter(g=>g.id!=='local-recovery')];
      state.gallerySavedIds.push(galleryId);
      galleryRecoveryRemove(galleryId);
      return {...item,persisted:true,generationId:d.generation.id||null};
    }catch(e){
      lastError=e;
      console.warn(`Galeria: tentativa ${attempt+1}/2 falhou`,e);
      if(attempt===0)await new Promise(r=>setTimeout(r,350));
    }
  }

  // Não esconda a arte: mantém no cache local e deixa a Galeria mostrá-la.
  state.library.generations=mergeGalleryGenerations((state.library.generations||[]).filter(g=>g.id!=='local-recovery'));
  return {...item,persisted:false,error:lastError?.message||'Falha ao registrar no banco'};
}

function galleryRecoveryUpsert(item){

function galleryRootId(item,byId){

function galleryFamilies(items){
  const byId=new Map((items||[]).filter(x=>x?.galleryId).map(x=>[String(x.galleryId),x])),groups=new Map();
  for(const item of items){

function restoreRecipeToQuick(recipe={},options={}){

  const copy=(key,...aliases)=>{
    for(const k of [key,...aliases]){
      if(source[k]!==undefined&&source[k]!==null){q[key]=source[k];return}
    }
  };
  copy('title');copy('subtitle');copy('date');copy('time');copy('address');
  copy('theme');copy('style');copy('format');copy('referenceMode');
  copy('pastorPhotoTreatment');
  if(Array.isArray(source.pastorAssetIds))q.pastorAssetIds=[...source.pastorAssetIds].slice(0,3);
  else if(Array.isArray(source.pastors))q.pastorAssetIds=source.pastors.map(x=>typeof x==='object'?x.id:x).filter(Boolean).slice(0,3);
  if(source.pastorNames&&typeof source.pastorNames==='object')q.pastorNames={...source.pastorNames};

}

async function publishGalleryItemManually(galleryId,button=null){
  const item=findGalleryItem(galleryId);
  if(!item){
    appAlert('Arte não encontrada na Galeria.',{type:'error',title:'Não foi possível publicar'});
    return;
  }

  const originalText=button?.textContent||'↑ Publicar';

  try{
    if(button){
      button.disabled=true;
      button.textContent='Publicando...';
      button.classList.add('publishing');
    }

    const d=await apiJSON('publish-gallery-item',{
      method:'POST',
      body:{galleryId}
    });

    if(!d?.published)throw new Error('O servidor não confirmou a publicação.');

    const publishedAt=d.publishedAt||new Date().toISOString();

    item.recipe=item.recipe||{};
    item.recipe.feedPublishedAt=publishedAt;
    item.feedPublishedAt=publishedAt;
    item.recipe.downloadedAt=item.recipe.downloadedAt||publishedAt;
    item.downloadedAt=item.recipe.downloadedAt;

    // Atualiza também a estrutura persistente em memória da Galeria.
    state.library.generations=(state.library.generations||[]).map(g=>({
      ...g,
      images:(g.images||[]).map(im=>{
        if(String(im.galleryId||'')!==String(galleryId))return im;
        return {
          ...im,
          feedPublishedAt:publishedAt,
          downloadedAt:im.downloadedAt||publishedAt,
          recipe:{
            ...(im.recipe||{}),
            feedPublishedAt:publishedAt,
            downloadedAt:im.recipe?.downloadedAt||publishedAt
          }
        };
      })
    }));

    const ids=galleryDownloadedIds();
    ids.add(String(galleryId));
    try{localStorage.setItem(GALLERY_DOWNLOADED_KEY,JSON.stringify([...ids]))}catch{}

    if(button){
      button.disabled=true;
      button.classList.remove('publishing');
      button.classList.add('published');
      button.textContent='✓ Postado';
      button.removeAttribute('data-gallery-publish');
    }

    // Mantém a Galeria aberta, mas já reflete o estado Postado.
    const q=document.querySelector('#gallerySearch')?.value||'';
    openGallery(q,state.galleryViewMode||'grid');

    appToast('Arte postada no Feed e movida para o topo.',{
      type:'success',
      title:'Postado'
    });
  }catch(e){
    if(button){
      button.disabled=false;
      button.classList.remove('publishing');
      button.textContent=originalText;
    }
    appAlert(e.message||'Não foi possível publicar esta arte.',{
      type:'error',
      title:'Não foi possível publicar'
    });
  }
}

async function callQualityInspector(payload,signal=null){
  try{
    const r=await authFetch('/api/quality-inspector',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});
    const text=await r.text();
    let data;
    try{data=JSON.parse(text)}
    catch{
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:['Fiscal retornou resposta inválida.'],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'invalid_json'}
      };
    }
    if(!r.ok){
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:[data?.error||`Fiscal indisponível (${r.status}).`],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'http_error'}
      };
    }
    assertInspectorResponse(data);
    recordOpenAIRequest('Fiscal visual',data.meta||{});
    const review=data.review;
    if(typeof review.approved!=='boolean'){
      return {
        approved:true,
        critical_error:false,
        score:0,
        technicalFailure:true,
        gross_errors:['Fiscal não devolveu uma decisão válida.'],
        correction_prompt:'',
        _meta:{technicalFailure:true,reason:'invalid_shape'}
      };
    }
    return review;
  }catch(e){
    if(e?.name==='AbortError')throw e;
    return {
      approved:true,
      critical_error:false,
      score:0,
      technicalFailure:true,
      gross_errors:[`Fiscal indisponível: ${e.message||'falha técnica'}`],
      correction_prompt:'',
      _meta:{technicalFailure:true,reason:'exception'}
    };
  }
}

    const request={...payload,qualityCorrection,revisionAttempt:attempt,safeMode:attempt>=maxCorrections&&attempt>0};
    const r=await authFetch('/api/generate-art',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request),signal});

    if(!r.ok)throw new Error(data.error||`Erro ${r.status}`);assertGeneratorResponse(data);recordOpenAIRequest(attempt===0?'Gerador de imagem':`Retry de imagem ${attempt}`,data.image.meta||{});lastImage=data.image;

    lastReview=review;

function confirmQuickMissingItems(missing=[]){
  return new Promise(resolve=>{
    if(!missing.length){resolve(true);return;}
    const root=document.querySelector('#modalRoot');
    if(!root){resolve(false);return;}
    const previous=root.innerHTML;
    root.innerHTML=`<div class="modal-backdrop" data-missing-confirm-backdrop>
      <div class="modal-panel" style="width:min(520px,94vw)">
        <div class="modal-head"><h2>Informações não preenchidas</h2><button class="close-modal" type="button" data-missing-cancel>×</button></div>
        <div class="modal-body">
          <p style="font-size:13px;line-height:1.55;margin:0 0 12px">Você tem certeza que deseja continuar sem informar estes itens?</p>
          <div class="missing-confirm-list">
            ${missing.map(x=>`<div style="padding:5px 0;font-size:12px">• ${esc(x)}</div>`).join('')}
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
            <button class="btn" type="button" data-missing-cancel>Voltar e preencher</button>
            <button class="btn primary" type="button" data-missing-continue>Continuar mesmo assim</button>
          </div>
        </div>
      </div>
    </div>`;
    let done=false;
    const finish=v=>{if(done)return;done=true;root.innerHTML=previous;resolve(v);};
    root.querySelectorAll('[data-missing-cancel]').forEach(b=>b.onclick=()=>finish(false));
    root.querySelector('[data-missing-continue]').onclick=()=>finish(true);
    root.querySelector('[data-missing-confirm-backdrop]').onclick=e=>{if(e.target===e.currentTarget)finish(false);};
    const escHandler=e=>{if(e.key==='Escape'){document.removeEventListener('keydown',escHandler,true);finish(false);}};
    document.addEventListener('keydown',escHandler,true);
  });
}
async function requestQuickGenerationWithMissingCheck(){
  const missing=quickMissingCreationItems();
  if(missing.length){
    const ok=await confirmQuickMissingItems(missing);
    if(!ok)return;
  }
  return runQuickGeneration('Principal',0);
}

let quickProgressVisual=0,quickProgressTarget=0,quickProgressRaf=null,quickProgressHideTimer=null;
function quickProgressCeiling(pct){
  const p=Number(pct)||0;if(p<=0)return 0;if(p>=100)return 100;
  if(p<=8)return 27;if(p<=18)return 44;if(p<=30)return 46;if(p<=48)return 85;if(p<=88)return 97;return Math.min(98,p+5);
}
function animateQuickProgress(){
  const wrap=document.querySelector('#quickProgress'),bar=document.querySelector('#quickProgressBar'),num=document.querySelector('#quickProgressPct');
  if(!wrap){quickProgressRaf=null;return}
  const diff=quickProgressTarget-quickProgressVisual;
  if(Math.abs(diff)>.03){
    const step=Math.max(.035,Math.abs(diff)*(quickProgressTarget>=100?.16:.018));
    quickProgressVisual+=Math.sign(diff)*Math.min(Math.abs(diff),step);
  }else quickProgressVisual=quickProgressTarget;
  const shown=Math.max(0,Math.min(100,quickProgressVisual));if(bar)bar.style.width=`${shown.toFixed(2)}%`;if(num)num.textContent=`${Math.floor(shown)}%`;
  if(quickProgressVisual!==quickProgressTarget||quickProgressTarget<100)quickProgressRaf=requestAnimationFrame(animateQuickProgress);else quickProgressRaf=null;
}
function setQuickProgress(pct,text){
  const wrap=document.querySelector('#quickProgress'),label=document.querySelector('#quickProgressText');if(!wrap)return;
  const p=Math.max(0,Math.min(100,Number(pct)||0));if(quickProgressHideTimer){clearTimeout(quickProgressHideTimer);quickProgressHideTimer=null}
  if(p===0){quickProgressVisual=0;quickProgressTarget=0;wrap.classList.remove('show');const bar=document.querySelector('#quickProgressBar'),num=document.querySelector('#quickProgressPct');if(bar)bar.style.width='0%';if(num)num.textContent='0%';if(label)label.textContent=text||'Processando sua arte...';return}
  wrap.classList.add('show');if(label)label.textContent=text||'Processando sua arte...';quickProgressTarget=quickProgressCeiling(p);
  if(p>=100){quickProgressTarget=100;quickProgressHideTimer=setTimeout(()=>wrap.classList.remove('show'),900)}
  if(!quickProgressRaf)quickProgressRaf=requestAnimationFrame(animateQuickProgress);
}


function protectedAssetPlan(payload={}){
  const p=payload.artDirection?.protected_assets||{};
  const churchRegion=payload.logoPosition||p.church_logo_region||'top-left';
  const eventRegion=payload.eventLogoPosition||p.event_logo_region||'right-middle';
  const churchWidth=Math.max(10,Math.min(28,Number(p.church_logo_width_pct)||20));
  const requested={small:14,medium:20,large:26}[payload.eventLogoSize||payload.assets?.eventLogo?.size||'small']||14;
  const eventWidth=Math.max(10,Math.min(28,Number(p.event_logo_width_pct)||requested));
  return {churchRegion,eventRegion,churchWidth,eventWidth};
}
function logoBoxForRegion(kind,region,widthPct,imgW,imgH,canvasW,canvasH){
  const safeX=.07*canvasW,safeY=.07*canvasH,w=widthPct/100*canvasW,h=w*(imgH/imgW);
  if(kind==='church'){
    const m={
      'top-left':[safeX,safeY],'top-center':[(canvasW-w)/2,safeY],'top-right':[canvasW-safeX-w,safeY],
      'bottom-left':[safeX,canvasH-safeY-h],'bottom-center':[(canvasW-w)/2,canvasH-safeY-h],'bottom-right':[canvasW-safeX-w,canvasH-safeY-h]
    };
    const [x,y]=m[region]||m['top-left'];return{x,y,w,h};
  }
  const m={'left-top':[.32,.32],'right-top':[.68,.32],'left-middle':[.32,.50],'right-middle':[.68,.50],'left-bottom':[.32,.68],'right-bottom':[.68,.68]};
  const [cx,cy]=m[region]||m['right-middle'];let x=cx*canvasW-w/2,y=cy*canvasH-h/2;
  x=Math.max(safeX,Math.min(canvasW-safeX-w,x));y=Math.max(safeY,Math.min(canvasH-safeY-h,y));return{x,y,w,h};
}
async function drawExactOfficialLogo(ctx,canvas,asset,kind,region,widthPct){

  const img=await loadImageSafe(url),iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  const b=logoBoxForRegion(kind,region,widthPct,iw,ih,canvas.width,canvas.height);
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,b.x,b.y,b.w,b.h);ctx.restore();
}

async function composeOfficialLogos(baseDataUrl,payload,target,options={}){
  const church=payload.assets?.logo||null,event=payload.assets?.eventLogo||null;
  const expected=(church&&!payload.omitChurchLogo?1:0)+(event&&!payload.omitEventLogo?1:0);
  if(!expected)return{dataUrl:baseDataUrl,placements:[],receipt:[],occupancy:options.occupancy||fallbackOccupancy(target,'no-logos'),logoPlan:{version:1,placements:[],degradations:[]},audit:{ok:true,expected:0,applied:0},degradations:[]};

  try{
    const pastorCount=(payload.assets?.pastors||[]).filter(Boolean).length||(payload.assets?.pastor?1:0);
    const rc=payload.requiredContent||{};
    const hasText=!![rc.title,rc.subtitle,rc.date,rc.time,rc.address,payload.instruction].filter(Boolean).length;
    let occupancy=options.occupancy||null;
    if(occupancy?.semanticUnavailable||occupancy?.degraded)occupancy=null;
    occupancy=occupancy||await analyzeLogoOccupancy(baseDataUrl,target,options.signal||null,{pastorCount,hasText});
    const preferences=await buildLogoPreferences(payload,target);
    const logoPlan=solveLogoPlan(occupancy,preferences);
    const rendered=await renderLogoPlan(baseDataUrl,logoPlan,preferences);
    const applied=rendered.receipt.filter(r=>!r.omitted).length;
    const audit={
      ok:applied===expected,
      expected,applied,
      slots:rendered.receipt.map(r=>({slot:r.slot,expectedAssetId:r.expectedAssetId||null,actualAssetId:r.actualAssetId||null,omitted:!!r.omitted,reason:r.reason||null}))
    };
    return{dataUrl:rendered.dataUrl,placements:logoPlan.placements,receipt:rendered.receipt,occupancy,logoPlan,audit,degradations:rendered.degradations};
  }catch(e){
    console.error('Logo pipeline bulkhead: entregando base plate intacta.',e);
    return{
      dataUrl:baseDataUrl,placements:[],receipt:[],
      occupancy:options.occupancy||fallbackOccupancy(target,'logo-pipeline-exception'),
      logoPlan:{version:1,placements:[],degradations:['exception']},
      audit:{ok:false,expected,applied:0,error:e.message||'logo-pipeline-exception'},
      degradations:['exception']
    };
  }
}

async function applyDiscreteScreenTitle(dataUrl,text,target={}){

  const img=await loadImageSafe(dataUrl),cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});

async function resizeToTarget(dataUrl,target){
  const img=await loadImageSafe(dataUrl);
  const srcW=img.naturalWidth||img.width,srcH=img.naturalHeight||img.height;
  const targetW=Number(target.width)||srcW,targetH=Number(target.height)||srcH;
  const srcRatio=srcW/srcH,targetRatio=targetW/targetH;
  const ratioDrift=Math.abs(Math.log(srcRatio/targetRatio));

  // Com size nativo, normalmente não haverá diferença relevante.
  // Pequenas diferenças técnicas são normalizadas por cover.
  // Diferença grande NÃO causa retry nem erro: preservamos a arte paga e marcamos
  // fallback interno. Isso só deve ocorrer se a API/modelo ignorar o size solicitado.
  const c=document.createElement('canvas');
  c.width=targetW;c.height=targetH;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';

  const aspectRatioFallback=ratioDrift>0.08;
  drawImageCover(ctx,img,c.width,c.height);

}
