<!-- CHURCHDESIGN — share-page v0.3 -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Pacote de artes • ChurchDesign</title>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#747b86;--line:#e4e7eb;--accent:#f36f2b;--accent2:#ff955d;--good:#1d9b5c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,a{font:inherit}.shell{max-width:1180px;margin:0 auto;padding:34px 22px 70px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}.brand{display:flex;align-items:center;height:34px}.brand img{display:block;max-width:190px;max-height:34px;width:auto;height:auto}.brand-fallback{display:none;font-size:17px;font-weight:900;letter-spacing:-.03em;color:var(--text)}
    .secure{font-size:10px;color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:#fff}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:24px}.church{display:flex;align-items:center;gap:13px;margin-bottom:18px}.avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#eceff2;border:1px solid var(--line);font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}
    .church strong{display:block;font-size:12px}.church small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.hero h1{font-size:clamp(28px,5vw,52px);line-height:.98;letter-spacing:-.045em;margin:0;max-width:760px}.hero p{margin:13px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
    .download-all{height:44px;border:0;border-radius:11px;padding:0 16px;background:#17191d;color:#fff;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap}.download-all:hover{transform:translateY(-1px)}
    .notice{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:22px;color:var(--muted);font-size:10.5px}
    .grid{columns:3 270px;column-gap:16px}.art{break-inside:avoid;margin:0 0 16px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(27,34,43,.045)}.art img{display:block;width:100%;height:auto;background:#eceff2}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px}.meta strong{display:block;font-size:10.5px}.meta small{display:block;margin-top:3px;color:var(--muted);font-size:8.5px}.download-one{height:31px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#f9fafb;color:#202328;font-size:8.5px;font-weight:800;cursor:pointer}.download-one:hover{border-color:#cdd2d8;background:#fff}
    .footer{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:9px}.footer strong{color:#3b4048}
    .state{min-height:55vh;display:grid;place-items:center;text-align:center}.state-card{max-width:480px;padding:28px;border:1px solid var(--line);border-radius:18px;background:#fff}.state-card h2{margin:0;font-size:20px}.state-card p{margin:9px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
    .spinner{width:26px;height:26px;border-radius:50%;border:3px solid #e6e9ed;border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:760px){.shell{padding:22px 14px 50px}.top{margin-bottom:26px}.hero{grid-template-columns:1fr;align-items:start}.download-all{width:100%}.grid{columns:1}.art{margin-bottom:14px}.notice{align-items:flex-start;flex-direction:column}.footer{flex-direction:column}.hero h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand"><img src="/churchdesign-logo-light.png" alt="ChurchDesign" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="brand-fallback">ChurchDesign</span></div><div class="secure">LINK TEMPORÁRIO</div></div>
    <div id="app"><div class="state"><div><div class="spinner"></div><span style="font-size:11px;color:var(--muted)">Carregando pacote...</span></div></div></div>
  </main>
  <script>
    const app=document.querySelector('#app');
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const formatDate=v=>{try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return''}};
    const safeName=s=>String(s||'arte').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,90)||'arte';
    async function forceDownload(url,name){
      try{
        const r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error('download');
        const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);
      }catch{window.open(url,'_blank','noopener')}
    }
    async function load(){
      const token=new URLSearchParams(location.search).get('token')||'';
      if(!token){return error('Link inválido','Este endereço não contém um pacote de download válido.')}
      try{
        const r=await fetch(`/api/share?token=${encodeURIComponent(token)}`,{cache:'no-store'}),d=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(d.error||'Não foi possível abrir este pacote.');
        document.title=`${d.title||'Pacote de artes'} • ChurchDesign`;
        const initial=esc((d.church?.name||'I').trim().charAt(0).toUpperCase());
        app.innerHTML=`<section class="hero">
          <div>
            <div class="church"><div class="avatar">${d.church?.profileLogoUrl?`<img src="${esc(d.church.profileLogoUrl)}" alt="">`:initial}</div><div><strong>${esc(d.church?.name||'Igreja')}</strong><small>Compartilhado pelo ChurchDesign</small></div></div>
            <h1>${esc(d.title||'Pacote de artes')}</h1>
            <p>Baixe as artes deste pacote em alta resolução. Os arquivos originais permanecem armazenados na Galeria da igreja.</p>
          </div>
          <button class="download-all" id="downloadAll">↓ Baixar todas</button>
        </section>
        <div class="notice"><span>${d.items.length} arquivo${d.items.length===1?'':'s'} disponível${d.items.length===1?'':'is'}</span><span>Link válido até ${esc(formatDate(d.expiresAt))}</span></div>
        <section class="grid">${d.items.map((x,i)=>`<article class="art"><img src="${esc(x.url)}" alt="${esc(x.label)}" loading="${i<2?'eager':'lazy'}"><div class="meta"><div><strong>${esc(x.label||x.projectName||'Arte')}</strong><small>${esc(x.formatLabel||x.format||'Arquivo')}</small></div><button class="download-one" data-download="${i}">↓ Baixar</button></div></article>`).join('')}</section>
        <footer class="footer"><span>Pacote criado no <strong>ChurchDesign</strong></span><span>O acesso é encerrado automaticamente após a validade do link.</span></footer>`;
        document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>{const x=d.items[Number(b.dataset.download)];forceDownload(x.url,`ChurchDesign-${safeName(x.label||x.projectName||'arte')}.png`)});
        document.querySelector('#downloadAll').onclick=async()=>{for(let i=0;i<d.items.length;i++){const x=d.items[i];await forceDownload(x.url,`ChurchDesign-${String(i+1).padStart(2,'0')}-${safeName(x.label||x.projectName||'arte')}.png`);await new Promise(r=>setTimeout(r,350))}};
      }catch(e){error(e.message.includes('expir')?'Link expirado':'Não foi possível abrir',e.message)}
    }
    function error(title,message){app.innerHTML=`<div class="state"><div class="state-card"><h2>${esc(title)}</h2><p>${esc(message)}</p></div></div>`}
    load();
  </script>
</body>
</html>
